# Subtitle parsers in pure Kotlin: SubRip, WebVTT and the ASS dialogue tier. Cue timing, layout and
# rasterisation live in the engine and in kiteplayer-output.
product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX64
    - androidNativeX86
    - linuxX64
    - linuxArm64
    - mingwX64
    - js
    - wasmJs

apply:
  - //kiteplayer.module-template.yaml
  - //android.module-template.yaml
  - //library.module-template.yaml

dependencies:
  - //kiteplayer-core: exported

settings:
  kotlin:
    optIns: [ io.github.yuroyami.kiteplayer.KitePlayerInternalApi ]
  android:
    namespace: io.github.yuroyami.kiteplayer.subtitles
  publishing:
    pom:
      name: kiteplayer-subtitles
      description: SubRip, WebVTT and ASS dialogue parsers for KitePlayer, in Kotlin.
      licenses:
        - name: BSD 3-Clause License (bundled WHATWG encoding tables)
          url: https://encoding.spec.whatwg.org/

plugins:
  publication-check:
    enabled: true
  abi-check:
    enabled: true
    androidDumpDir: api/android
    klibPlatforms: [ androidNativeArm32, androidNativeArm64, androidNativeX64, androidNativeX86, iosArm64, iosSimulatorArm64, iosX64, js, linuxArm64, linuxX64, macosArm64, mingwX64, tvosArm64, tvosSimulatorArm64, wasmJs, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64 ]
  dokka:
    enabled: true
    moduleName: kiteplayer-subtitles

# Gradle named the klib "io.github.yuroyami:kiteplayer-subtitles". Keep that name, or libraries built against earlier
# releases fail to link on Kotlin/Native. Set it per platform: on @native, it also renames the
# klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-subtitles, -Xshort-module-name=kiteplayer-subtitles ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-subtitles, -Xshort-module-name=kiteplayer-subtitles ]

