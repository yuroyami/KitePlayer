#Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.apple.xcodeCompatibility.nowarn=true
kotlin.native.ignoreDisabledTargets=true

#Dokka (v2 generator, aggregated API site at build/dokka/html)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

#Android
android.useAndroidX=true

#Library coordinates
GROUP=io.github.yuroyami
VERSION=0.0.2
DESCRIPTION=KitePlayer: a Kotlin Multiplatform media player engine. The player class, the session loop, the clock, A/V synchronisation, queueing, buffering, seeking and track selection are pure Kotlin in commonMain. Reading, decoding and output are per-platform backends behind service interfaces, and today only macOS arm64 has any. Nothing is published from here yet.
