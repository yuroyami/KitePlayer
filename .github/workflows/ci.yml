# KitePlayer's first continuous integration, 2026-08-24.
#
# Until today this repository had no `.github` directory at all, which meant every claim about its
# health was a claim about ONE laptop: nine C suites that had never run anywhere else, a Linux
# native target that only ever CROSS-LINKED, and a Windows target that had never executed a single
# test. KiteFFmpeg's ci.yml is the template and its lessons are carried over deliberately rather
# than rediscovered:
#
#   - The Kotlin/Native toolchain is WARMED before anything reaches a C task. CompileKiteRtTask
#     compiles the audio ring with konan's own clang, from
#     `<konan data>/dependencies/<llvm package>/bin/clang`, and konan fetches that on demand when a
#     Kotlin/Native task first runs. On a fresh runner the C task gets there first and dies with
#     "no clang under ...". That single race was six of KiteFFmpeg's ten failing jobs.
#     `downloadKotlinNativeDistribution` is the provisioning task, so the warmup here asks for it
#     by name instead of relying on a compile that happens to run early.
#   - `~/.konan` is cached in every job that touches a native target, because it holds the LLVM and
#     the per-target sysroots and re-fetching them is the single largest cost in the run.
#   - Every job says what it does NOT cover. A green tick that quietly skipped something is the
#     failure mode this project keeps paying for.
#
# WHAT THIS RUN DOES NOT COVER, stated once here rather than discovered later:
#
#   - `:kiteplayer-output`'s CoreAudio suites on the iOS SIMULATOR. They open a real audio unit and
#     the simulator answers -10851 (kAudioUnitErr_InvalidPropertyValue), so the whole
#     CoreAudioSink family fails there for the environment rather than for the code. Reproduced on
#     the proving Mac before this file existed. They DO run in the macos-host job, where the audio
#     device is real.
#   - `:kiteplayer-ffmpeg` on the iOS simulator: RealMediaSeekTest cannot see the host's testmedia
#     tree through the simctl spawn boundary, and VideoToolboxDecodeTest needs hardware the
#     simulator does not have. Four failures, all environment.
#   - Android device tests on real hardware, and the physical-device rows. Those stay
#     owner-gated, tracked in the hardware verification plan. The android-emulator job runs the
#     device test sets on an x86_64 emulator, except the classes that need clips on the device;
#     that job names them.
#   - `:kiteplayer-compose`, `:kiteplayer-compose-interop` and `:kiteplayer-phone`, which have test
#     TASKS and no test SOURCES. They were named here on the first run and came back NO-SOURCE.
#     Naming a task that cannot run is how a job looks broader than it is, so they are gone from
#     the lists and the gap is an issue instead.
#   - A PINNED fixture generator. The clips are made by whatever ffmpeg Homebrew ships that week,
#     which is 8.1.2 today and 8.0 on the proving Mac. That gap is tracked as an issue.
#   - `:kiteplayer-output`'s CoreAudio ANCHOR assertion, on macOS too. See the macos-host job: this
#     runner's audio device lags where real hardware leads, so the one assertion that depends on
#     that is filtered out by name and reported as not run. The other 94 tests in the module,
#     CoreAudio ones included, do run here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # The publish workflow runs this whole file on the commit it is about to publish.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when the publish workflow calls this file, so a release
  # run and a push run on the same branch never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gradle's own daemon is pointless on a runner that exits after one build, and the file-watching
  # it enables costs startup time. Everything else stays as gradle.properties has it, including the
  # configuration cache, because CI should build the way the developer builds.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:

  # ---------------------------------------------------------------------------------------------
  # The headline. Nine C suites, off this project's one laptop for the first time.
  # ---------------------------------------------------------------------------------------------
  c-suites:
    name: The C suites (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No JDK, no Gradle, no network. build-host.sh drives /usr/bin/clang directly and the ring
      # includes stdint, stdlib, string and stdatomic and nothing else. That is why this job is the
      # cheapest one here and also the one with the least that can go wrong.
      #
      # WHY macOS AND ONLY macOS, and it is not a preference. The allocation interposer is a Mach-O
      # __DATA,__interpose dylib, which only dyld honours; the device suites link
      # -framework AudioToolbox -framework CoreAudio. Neither has a Linux or Windows form, so a
      # second runner would not be broader coverage, it would be a rewrite.
      - name: kiteplayer-rt, plain (the correctness and allocation variant)
        working-directory: kiteplayer-rt/native
        run: ./scripts/build-host.sh plain && ./scripts/run-c-tests.sh plain

      # NOT a fourth build. It reruns the PLAIN binaries with KPRT_REQUIRE_ALLOC_ACCOUNTING=1, so a
      # suite that cannot observe the interposer FAILS instead of quietly recording a zero. Without
      # it, "nothing allocated" and "nothing was counting" look identical.
      - name: kiteplayer-rt, interpose (prove the instrument is live)
        working-directory: kiteplayer-rt/native
        run: ./scripts/run-c-tests.sh interpose

      - name: kiteplayer-rt, asan + ubsan
        working-directory: kiteplayer-rt/native
        run: ./scripts/build-host.sh asan && ./scripts/run-c-tests.sh asan

      # The variant that earns its keep: the ring is two seqlocks and two lock-free counters, and a
      # seqlock written with plain fields instead of C11 atomics is a real race TSan reports.
      - name: kiteplayer-rt, tsan
        working-directory: kiteplayer-rt/native
        run: ./scripts/build-host.sh tsan && ./scripts/run-c-tests.sh tsan

      # The libass suites borrow kiteplayer-rt's harness on purpose (same repository, same build
      # layer, same prefix). The packing suite needs neither jni.h nor libass; the driver suite
      # needs a real libass and asserts pixels, which is why the formula is installed here.
      - name: Install libass for the driver suite
        run: brew install libass
      - name: kiteplayer-libass, plain then asan
        working-directory: kiteplayer-libass/native
        run: ./scripts/run-c-tests.sh plain && ./scripts/run-c-tests.sh asan

  # ---------------------------------------------------------------------------------------------
  # The macOS host: the only runner that gets the real media, plus every ratchet.
  # ---------------------------------------------------------------------------------------------
  macos-host:
    name: macOS arm64 (real media, JVM + native, the ratchets)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-macos-arm64-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-macos-arm64-

      # :kiteplayer-libass no longer reads Homebrew's libass: every target embeds the chain the
      # sibling cross-builds, downloaded here from the KiteFFmpeg release pinned in
      # kiteplayer-libass/ass-chain.sha256 (no sibling checkout on a runner). ffmpeg is the fixture
      # generator below.
      #
      # WHY THE FIXTURES ARE GENERATED ON macOS AND NOWHERE ELSE: one codec set, one place, so a
      # red is about the player rather than about which runner made the clips. Ubuntu's apt ffmpeg
      # is a different release again.
      #
      # THE GENERATOR IS PINNED TO A SERIES, and the series is the one the clips are recorded
      # against (EXPECTED_FFMPEG_SERIES in testmedia.sh) and the one the player's own library is
      # on: KiteFFmpeg 0.3.0 carries FFmpeg 9.0.2. Both halves matter, because some fixtures are
      # oracles that FFmpeg itself produces, and an oracle from another major is a different
      # answer. Measured the day the unversioned formula moved to 9.0, while the player still
      # decoded through FFmpeg 8: the 5.1 reference PCM came out 384 sample frames shorter, since
      # FFmpeg 9 trims the trailing AAC padding and FFmpeg 8 does not. Same clip, same bytes, one
      # version of the oracle. The earlier lesson still holds too: 8.1.2 interleaves the subtitle
      # packet in multitrack.mkv later than 8.0, which is why the matrix reads until it has the cue
      # it asked for.
      # Homebrew keeps a versioned formula only for an older series, so the current series is the
      # unversioned ffmpeg. The strict check below refuses when that formula moves to the next
      # major. Then pin this series with its versioned formula, ffmpeg@9.
      # When KiteFFmpeg moves to the next major, move the formula and EXPECTED_FFMPEG_SERIES together.
      # brew update first: the runner image ships a formula index from the day it was built, so
      # without it the unversioned formula can still be an older series, and a versioned formula
      # younger than the image does not exist at all (a run once answered "No available formula
      # with the name ffmpeg@8").
      - name: Install the ffmpeg CLI the clips are recorded against
        run: |
          brew update --quiet
          brew install ffmpeg
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"

      # One line in the log so the next fixture divergence is diagnosable by reading rather than by
      # bisecting. This is what turned "multitrack.mkv decoded no subtitle cue" into an answer.
      # The version is CHECKED here, strictly: a series that differs from the recorded one is a
      # refusal on this runner, not the warning a developer's machine gets, because a red that says
      # "wrong ffmpeg" beats a red that says "384 frames" an hour later.
      # The same check runs inside testmedia.sh below, but that is after the Kotlin/Native warmup
      # and 27 seconds of encoding, and a toolchain move should not be paid for twice.
      - name: Check the ffmpeg the clips are pinned to
        run: ./scripts/testmedia.sh --check-only
        env:
          TESTMEDIA_STRICT_FFMPEG: "1"

      # BEFORE any Gradle task that could reach compileKiteRtCFor<Target>. See the file header.
      - name: Warm the Kotlin/Native toolchain
        run: ./gradlew :kiteplayer-rt:downloadKotlinNativeDistribution --stacktrace

      # 27 seconds and about 560 MB on the proving machine, which is why this is generated per run
      # rather than cached: the cache would cost more to move than the clips cost to make.
      - name: Generate the test clips
        run: ./scripts/testmedia.sh

      # The script writes testmedia/MANIFEST.txt: the ffmpeg that made the clips,
      # and every clip's size and SHA-256. Printed rather than verified, deliberately. A checksum
      # GATE would turn every legitimate ffmpeg upgrade into a red build; a printed manifest turns
      # "why did that matrix row behave differently on the runner" into a diff between two logs.
      - name: The clips, and what made them
        run: cat testmedia/MANIFEST.txt

      # The ratchets first, because a surface change should fail before a two-minute test suite
      # does. checkKotlinAbi is Kotlin's own ABI validation (checkLegacyAbi is its deprecated
      # spelling); checkKitertCoupling holds the kitert boundary against a committed baseline;
      # checkPublicationReadiness reads the generated POMs and the project dependency edges.
      - name: The ratchets
        run: |
          ./gradlew checkKotlinAbi checkKitertCoupling checkPublicationReadiness --stacktrace
          ./scripts/check-dependency-hygiene.sh

      # Every module that HAS jvm tests. The four that need the clips (ffmpeg, kiteplayer,
      # compose-video, audioviz) are here rather than on Linux for the generator reason above.
      #
      # `:kiteplayer-compose`, `:kiteplayer-compose-interop` and `:kiteplayer-phone` were in this
      # list for the first run and came back NO-SOURCE: they have a jvmTest TASK and no test
      # SOURCES, so naming them made the job look broader than it is. Removed. That those three
      # published modules have zero tests is a real gap and it belongs in an issue, not in a
      # green tick here.
      - name: JVM tests, every module that has them
        run: |
          ./gradlew --stacktrace \
            :kiteplayer-core:jvmTest \
            :kiteplayer-subtitles:jvmTest \
            :kiteplayer-io:jvmTest \
            :kiteplayer-output:jvmTest \
            :kiteplayer-view:jvmTest \
            :kiteplayer-network:jvmTest \
            :kiteplayer-ffmpeg:jvmTest \
            :kiteplayer-libass:jvmTest \
            :kiteplayer:jvmTest \
            :kiteplayer-compose-video:jvmTest \
            :kiteplayer-compose-ui:jvmTest \
            :kiteplayer-audioviz:jvmTest \
            :kiteplayer-sample-shared:jvmTest

      # One line per hot path gate (HotPathGate.kt in the core and FFmpeg JVM tests). A slow drift
      # shows here long before it reaches a bound of ten times the measured median. The harness's
      # own test prints a line too, so its report is left out.
      - name: The hot path numbers
        if: always()
        run: |
          {
            echo "### Hot paths on $RUNNER_OS, median of seven runs"
            echo
            echo "| Hot path | Median | Bound |"
            echo "|---|---:|---:|"
            find . -path '*/build/test-results/jvmTest/*.xml' ! -name '*HotPathGateTest.xml' -exec cat {} + |
              grep -o 'HOTPATH | .*' | sed 's/^HOTPATH //' || true
          } >> "$GITHUB_STEP_SUMMARY"

      # The Kotlin/Native host target. :kiteplayer-ffmpeg here is the format conformance matrix
      # against real clips, and :kiteplayer plays one clip through KitePlayerPlatform.createOrNull().
      #
      # -Pkiteplayer.noAudioHardware=true drops ONE assertion and nothing else. This runner opens
      # CoreAudio fine and passes 94 of the module's 95 macosArm64 tests, the other CoreAudio suites
      # included; the one it cannot pass is "the anchor the device publishes is in the near future
      # on the engine clock", which measured -451.7 ms against a window of -5 to +500. That is the
      # DEVICE and not the clock bases, since a base mismatch would be enormous rather than half a
      # second: a virtual output device lags where real hardware leads. Gradle reports the test as
      # NOT RUN rather than passed, which is the honest form, and a developer on a real Mac never
      # passes this flag and runs all 95. Both directions were measured before this line was added.
      - name: Kotlin/Native macosArm64 tests
        run: |
          ./gradlew --stacktrace -Pkiteplayer.noAudioHardware=true \
            :kiteplayer-core:macosArm64Test \
            :kiteplayer-subtitles:macosArm64Test \
            :kiteplayer-io:macosArm64Test \
            :kiteplayer-output:macosArm64Test \
            :kiteplayer-rt:macosArm64Test \
            :kiteplayer-libass:macosArm64Test \
            :kiteplayer-network:macosArm64Test \
            :kiteplayer-ffmpeg:macosArm64Test \
            :kiteplayer:macosArm64Test

      # An isolated external consumer must retain optional registration after Native release
      # optimization. A hosted runner also verifies public HTTPS independently of host firewalls.
      # Staging writes only build/verification-maven; these tasks never upload a release.
      - name: Published-format Native consumer and HTTPS
        run: |
          ./scripts/verify-network-distribution.sh --stage
          ./scripts/verify-network-distribution.sh --run --target macos --url https://example.com

      # Every published artifact against artifact-size-baseline.txt: the JVM jar, the Android
      # archive and the macOS and iOS klibs. A line more than ten percent above its baseline fails
      # and names itself, and the table goes into the run summary. After the tests, so a size
      # failure never hides a test failure.
      - name: Artifact sizes
        run: ./scripts/check-artifact-size.sh

      # The conformance table, which is the answer "green" does not carry: which clip played on
      # this platform and what happened when one did not. Written by the matrix run itself, before
      # its assertion, so a FAILING run uploads the table naming the row that failed. always(),
      # for the same reason.
      - name: The conformance report
        if: always()
        run: |
          for report in kiteplayer-ffmpeg/build/reports/conformance/*.md; do
            [ -f "$report" ] || continue
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-macos-host
          path: kiteplayer-ffmpeg/build/reports/conformance/*.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-host-reports
          # test-results carries the XML, and the XML carries stdout, stderr and the message of a
          # NATIVE crash. reports/ alone renders an empty "Failure details" box when the test
          # process dies instead of asserting, which is exactly the failure worth diagnosing.
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            testmedia/MANIFEST.txt
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # iOS, on the simulator, for the suites that do not need a device.
  # ---------------------------------------------------------------------------------------------
  ios-simulator:
    name: iOS simulator arm64 (device-free suites)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-ios-sim-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-ios-sim-
      - name: Warm the Kotlin/Native toolchain
        run: ./gradlew :kiteplayer-rt:downloadKotlinNativeDistribution --stacktrace

      # The list is exactly the modules whose iOS suites pass without a device or the host's disk.
      # :kiteplayer-output and :kiteplayer-ffmpeg are absent for the reasons in the file header, and
      # their absence is the honest form: a job that ran them and ignored the result would be worse
      # than one that says it did not run them.
      - name: iosSimulatorArm64 tests
        run: |
          ./gradlew --stacktrace \
            :kiteplayer-core:iosSimulatorArm64Test \
            :kiteplayer-subtitles:iosSimulatorArm64Test \
            :kiteplayer-io:iosSimulatorArm64Test \
            :kiteplayer-rt:iosSimulatorArm64Test \
            :kiteplayer-view:iosSimulatorArm64Test \
            :kiteplayer-network:iosSimulatorArm64Test \
            :kiteplayer-libass:iosSimulatorArm64Test \
            :kiteplayer-output:iosSimulatorArm64Test \
            :kiteplayer-audioviz:iosSimulatorArm64Test \
            :kiteplayer:iosSimulatorArm64Test

      # Compiling the device triples is a weaker claim than running them and is still worth making:
      # it is what catches an appleMain change that only breaks on the real target.
      - name: Compile the iOS device targets
        run: |
          ./gradlew --stacktrace \
            :kiteplayer-core:compileKotlinIosArm64 \
            :kiteplayer-output:compileKotlinIosArm64 \
            :kiteplayer-ffmpeg:compileKotlinIosArm64 \
            :kiteplayer-libass:compileKotlinIosArm64 \
            :kiteplayer-view:compileKotlinIosArm64 \
            :kiteplayer-audioviz:compileKotlinIosArm64

      # The sample app itself, which no step above builds: a framework that links and an app that
      # shows a frame are different claims. The app bundles testmedia/sync1080p30.mp4, so the clips
      # are generated here with the macOS job's pinned generator. The script builds the Xcode
      # project for the newest iPhone simulator, installs it, launches it with --s1b-smoke and
      # checks the record the app writes: the seek landed, playback ended, frames were presented
      # and the teardown completed.
      - name: Install the ffmpeg CLI the clips are recorded against
        run: |
          brew update --quiet
          brew install ffmpeg
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"
      - name: Generate the test clips
        run: ./scripts/testmedia.sh
      - name: The iOS sample app, built, installed and launched in its smoke mode
        run: ./scripts/ios-sample-smoke.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-reports
          # test-results carries the XML, and the XML carries stdout, stderr and the message of a
          # NATIVE crash. reports/ alone renders an empty "Failure details" box when the test
          # process dies instead of asserting, which is exactly the failure worth diagnosing.
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # tvOS and watchOS, on their simulators, for the four modules that declare those targets.
  # ---------------------------------------------------------------------------------------------
  tvos-watchos-simulator:
    name: tvOS and watchOS simulators arm64 (core, subtitles, io, rt)
    # Pinned on purpose. The Kotlin test task takes its device from `xcrun simctl list devices
    # available` and refuses to run when the image has no tvOS or watchOS simulator. The software
    # list of the macos-26 image names both, with 26.5 runtimes that match its default Xcode 26.6.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-tvos-watchos-sim-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-tvos-watchos-sim-

      # The runtimes the test tasks choose from, so that a refusal can be read against the image.
      - name: The simulator runtimes on this image
        run: xcrun simctl list runtimes

      - name: Warm the Kotlin/Native toolchain
        run: ./gradlew :kiteplayer-rt:downloadKotlinNativeDistribution --stacktrace

      # No other module declares these two targets. The tvOS and watchOS device targets are not run
      # here, and kiteplayer-rt has no tvOS or watchOS audio output, so no device audio runs either.
      - name: tvosSimulatorArm64 and watchosSimulatorArm64 tests
        run: |
          ./gradlew --stacktrace \
            :kiteplayer-core:tvosSimulatorArm64Test \
            :kiteplayer-subtitles:tvosSimulatorArm64Test \
            :kiteplayer-io:tvosSimulatorArm64Test \
            :kiteplayer-rt:tvosSimulatorArm64Test \
            :kiteplayer-core:watchosSimulatorArm64Test \
            :kiteplayer-subtitles:watchosSimulatorArm64Test \
            :kiteplayer-io:watchosSimulatorArm64Test \
            :kiteplayer-rt:watchosSimulatorArm64Test

      # A green run must say how many tests ran, not only that none failed. A task that wrote no
      # results, such as one that found no test source, shows "no results".
      - name: The test counts
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import glob, itertools, xml.etree.ElementTree as ET
          tasks = ("tvosSimulatorArm64Test", "watchosSimulatorArm64Test")
          modules = ("kiteplayer-core", "kiteplayer-subtitles", "kiteplayer-io", "kiteplayer-rt")
          print("### tvOS and watchOS simulator tests\n")
          print("| Test task | Tests | Failed | Skipped |\n|---|---:|---:|---:|")
          for task, module in itertools.product(tasks, modules):
              files = glob.glob(f"{module}/build/test-results/{task}/*.xml")
              roots = [ET.parse(f).getroot() for f in files]
              total = lambda *keys: sum(int(r.get(k, 0)) for r in roots for k in keys)
              cells = f"{total('tests')} | {total('failures', 'errors')} | {total('skipped')}"
              print(f"| :{module}:{task} | {cells if roots else 'no results | |'} |")
          EOF

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tvos-watchos-simulator-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Linux, JVM and Android host. No Kotlin/Native here at all, which is what makes it fast.
  # ---------------------------------------------------------------------------------------------
  linux-jvm-android:
    name: Linux x64 (JVM + Android host tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # AGP's own build cache. The SDK itself is NOT cached here: the runner image ships it, and
      # ${{ env.ANDROID_SDK_ROOT }} does not resolve in a `with:` block, because the env context
      # holds only workflow-declared variables and not the runner's own. A path written that way
      # expands to "/platforms" and silently caches nothing.
      - uses: actions/cache@v6
        with:
          path: ~/.android/build-cache
          key: android-build-cache-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            android-build-cache-

      # Only the modules whose tests need no clips. The media-backed suites run on macos-host,
      # where the fixture generator is the one the developer used. This job therefore proves the
      # PURE half on a second operating system, which is what it is for.
      # Same NO-SOURCE removal as the macOS job: compose, compose-interop and phone have test
      # tasks and no test sources.
      - name: JVM tests, media-free modules
        run: |
          ./gradlew --stacktrace \
            :kiteplayer-core:jvmTest \
            :kiteplayer-subtitles:jvmTest \
            :kiteplayer-io:jvmTest \
            :kiteplayer-output:jvmTest \
            :kiteplayer-view:jvmTest \
            :kiteplayer-network:jvmTest

      # One line per hot path gate (HotPathGate.kt in the core and FFmpeg JVM tests). A slow drift
      # shows here long before it reaches a bound of ten times the measured median. The harness's
      # own test prints a line too, so its report is left out.
      - name: The hot path numbers
        if: always()
        run: |
          {
            echo "### Hot paths on $RUNNER_OS, median of seven runs"
            echo
            echo "| Hot path | Median | Bound |"
            echo "|---|---:|---:|"
            find . -path '*/build/test-results/jvmTest/*.xml' ! -name '*HotPathGateTest.xml' -exec cat {} + |
              grep -o 'HOTPATH | .*' | sed 's/^HOTPATH //' || true
          } >> "$GITHUB_STEP_SUMMARY"

      # Android HOST tests, which are ordinary JVM tests against the Android variant. Device tests
      # are a different claim and are not made here.
      - name: Android host tests, media-free modules
        run: |
          ./gradlew --stacktrace \
            :kiteplayer-core:testAndroidHostTest \
            :kiteplayer-subtitles:testAndroidHostTest \
            :kiteplayer-io:testAndroidHostTest \
            :kiteplayer-output:testAndroidHostTest \
            :kiteplayer-view:testAndroidHostTest \
            :kiteplayer-network:testAndroidHostTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-jvm-android-reports
          # test-results carries the XML, and the XML carries stdout, stderr and the message of a
          # NATIVE crash. reports/ alone renders an empty "Failure details" box when the test
          # process dies instead of asserting, which is exactly the failure worth diagnosing.
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Android, on the SDK's own emulator: the device test sets, and the Kotlin/Native test binaries
  # of the Android x86_64 target. No third-party action; the SDK's own tools in shell steps.
  # ---------------------------------------------------------------------------------------------
  android-emulator:
    name: Android emulator x86_64 (device tests + Android native tests)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Report-only until the job has been green twice in a row: the publish workflow runs all of
    # this file, and an emulator that boots badly must not stop a release before it is trusted.
    continue-on-error: true
    env:
      # x86_64 because the runner is x86_64, and the emulator refuses an arm64 image on an x86_64
      # host. Google APIs at a recent API level. The arm64 code of every module is not run here.
      AVD_PACKAGE: system-images;android-35;google_apis;x86_64
      # These classes read clips that must be pushed to the device after install, and this job
      # does not push any yet. They are excluded by name, and the run summary lists them.
      DEVICE_TESTS_NOT_RUN_HERE: |
        io.github.yuroyami.kiteplayer.ffmpeg.FormatMatrixDeviceTest
        io.github.yuroyami.kiteplayer.ffmpeg.TrackSwitchDeviceTest
        io.github.yuroyami.kiteplayer.ffmpeg.TrackSwitchAudibleDeviceTest
        io.github.yuroyami.kiteplayer.compose.KiteVideoDeviceTest
        io.github.yuroyami.kiteplayer.compose.ReopenDeviceTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-android-emulator-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-android-emulator-
            konan-linux-x64-

      # The hosted Linux runners have KVM, and only root can open it until this rule is added.
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # sdkmanager can skip a package whose license is not accepted and still exit zero, so the
      # step checks that the emulator and the image are there. -accel-check fails when KVM is not
      # usable.
      - name: Install the emulator and the system image
        run: |
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          log="$RUNNER_TEMP/sdkmanager.log"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "$AVD_PACKAGE" \
            < /dev/null > "$log" 2>&1 || { cat "$log"; exit 1; }
          image="$ANDROID_HOME/$(echo "$AVD_PACKAGE" | tr ';' '/')"
          [ -x "$ANDROID_HOME/emulator/emulator" ] && [ -d "$image" ] || { cat "$log"; exit 1; }
          "$ANDROID_HOME/emulator/emulator" -version | head -n 1
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Create the virtual device
        run: |
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name kite --package "$AVD_PACKAGE" --device pixel_6 --force

      # In the background, so that it boots while Gradle builds. The runner stops it when the job
      # ends.
      - name: Start the emulator
        run: |
          nohup emulator -avd kite -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &

      # BEFORE any Gradle task that could reach compileKiteRtCFor<Target>. See the file header.
      - name: Warm the Kotlin/Native toolchain
        run: ./gradlew :kiteplayer-rt:downloadKotlinNativeDistribution --stacktrace

      # Every module that declares androidNativeX64, and the device test sources of every module
      # that has them. The other three Android native targets are arm or 32-bit, and none of them
      # runs here.
      - name: Build the Android native test binaries and the device test sources
        run: |
          ./gradlew --stacktrace \
            :kiteplayer-core:linkDebugTestAndroidNativeX64 \
            :kiteplayer-subtitles:linkDebugTestAndroidNativeX64 \
            :kiteplayer-io:linkDebugTestAndroidNativeX64 \
            :kiteplayer-rt:linkDebugTestAndroidNativeX64 \
            :kiteplayer-io:compileAndroidDeviceTestSources \
            :kiteplayer-output:compileAndroidDeviceTestSources \
            :kiteplayer-ffmpeg:compileAndroidDeviceTestSources \
            :kiteplayer-libass:compileAndroidDeviceTestSources \
            :kiteplayer-compose-video:compileAndroidDeviceTestSources

      - name: Wait for the emulator to finish booting
        id: boot
        run: |
          booted() { [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; }
          deadline=$((SECONDS + 600))
          if timeout 600 adb wait-for-device; then
            until booted || [ "$SECONDS" -ge "$deadline" ]; do sleep 5; done
          fi
          if ! booted; then
            echo "::error::The emulator did not finish booting within ten minutes."
            tail -n 100 "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          # Nothing on the screen may animate, lock or sleep while the tests drive activities.
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell svc power stayon true
          adb shell input keyevent 82
          echo "API $(adb shell getprop ro.build.version.sdk | tr -d '\r')," \
            "ABIs $(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"

      # --continue, so that one red module does not hide the counts of the other four. The runner
      # takes the excluded classes as one comma-separated list.
      - name: Device tests, every module that has them
        run: |
          not_run_here="$(printf '%s' "$DEVICE_TESTS_NOT_RUN_HERE" | paste -sd, -)"
          ./gradlew --stacktrace --continue \
            "-Pandroid.testInstrumentationRunnerArguments.notClass=$not_run_here" \
            :kiteplayer-io:connectedAndroidDeviceTest \
            :kiteplayer-output:connectedAndroidDeviceTest \
            :kiteplayer-ffmpeg:connectedAndroidDeviceTest \
            :kiteplayer-libass:connectedAndroidDeviceTest \
            :kiteplayer-compose-video:connectedAndroidDeviceTest

      # A test binary runs from its own directory on the device, which is also its TMPDIR. `adb
      # shell` returns the exit code of the command it ran.
      - name: Android native tests (androidNativeX64), on the emulator
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/test-logs"
          status=0
          for module in kiteplayer-core kiteplayer-subtitles kiteplayer-io kiteplayer-rt; do
            binary="$module/build/bin/androidNativeX64/debugTest/test.kexe"
            if [ ! -f "$binary" ]; then
              echo "::error::$module: no test binary at $binary"
              status=1
              continue
            fi
            dir="/data/local/tmp/kiteplayer/$module"
            adb shell mkdir -p "$dir"
            adb push "$binary" "$dir/test.kexe" > /dev/null
            adb shell chmod 755 "$dir/test.kexe"
            echo "::group::$module"
            adb shell "cd $dir && TMPDIR=$dir ./test.kexe" 2>&1 | tee "$RUNNER_TEMP/test-logs/$module.log"
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::error::$module: the test binary exited with code $code"
              status=1
            fi
          done
          exit $status

      # A green run must say how many tests ran, not only that none failed. A task or binary that
      # wrote no results shows "no results".
      - name: The test counts
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import glob, os, re, xml.etree.ElementTree as ET
          print("### Android emulator: device tests\n")
          print("| Test task | Tests | Failed | Skipped |\n|---|---:|---:|---:|")
          for module in ("kiteplayer-io", "kiteplayer-output", "kiteplayer-ffmpeg",
                         "kiteplayer-libass", "kiteplayer-compose-video"):
              files = glob.glob(f"{module}/build/outputs/androidTest-results/connected/**/*.xml",
                                recursive=True)
              roots = [ET.parse(f).getroot() for f in files]
              suites = [s for r in roots for s in ([r] if r.tag == "testsuite" else r.iter("testsuite"))]
              total = lambda *keys: sum(int(s.get(k, 0)) for s in suites for k in keys)
              cells = f"{total('tests')} | {total('failures', 'errors')} | {total('skipped')}"
              print(f"| :{module}:connectedAndroidDeviceTest | {cells if suites else 'no results | |'} |")
          print("\nNot run here, because they need clips on the device:\n")
          for name in os.environ["DEVICE_TESTS_NOT_RUN_HERE"].split():
              print(f"- `{name}`")
          print("\n### Android emulator: androidNativeX64 test binaries\n")
          print("| Test binary | Tests | Failed | Skipped |\n|---|---:|---:|---:|")
          for module in ("kiteplayer-core", "kiteplayer-subtitles", "kiteplayer-io", "kiteplayer-rt"):
              path = os.path.join(os.environ["RUNNER_TEMP"], "test-logs", f"{module}.log")
              text = open(path, errors="replace").read() if os.path.exists(path) else ""
              ran = re.search(r"^\[=+\] (\d+) tests? from .* ran", text, re.M)
              passed = re.search(r"^\[  PASSED  \] (\d+) tests?", text, re.M)
              failed = re.search(r"^\[  FAILED  \] (\d+) tests?, listed below", text, re.M)
              if not ran:
                  print(f"| {module} | no results | | |")
                  continue
              tests, ok, bad = int(ran[1]), int(passed[1]) if passed else 0, int(failed[1]) if failed else 0
              print(f"| {module} | {tests} | {bad} | {tests - ok - bad} |")
          EOF

      - name: Collect the emulator log and the device log
        if: failure()
        run: |
          mkdir -p build/emulator-logs
          cp "$RUNNER_TEMP/emulator.log" build/emulator-logs/ || true
          cp "$RUNNER_TEMP"/test-logs/*.log build/emulator-logs/ || true
          timeout 60 adb logcat -d > build/emulator-logs/logcat.txt 2>&1 || true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            build/emulator-logs/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Linux, Kotlin/Native. These binaries have been cross-linked on a Mac for months; this is where
  # they actually EXECUTE on a Linux kernel without a container in the way.
  # ---------------------------------------------------------------------------------------------
  linux-native:
    name: Linux x64 (Kotlin/Native, executed not just linked)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-linux-x64-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-linux-x64-
      - name: Warm the Kotlin/Native toolchain
        run: ./gradlew :kiteplayer-rt:downloadKotlinNativeDistribution --stacktrace

      # linuxX64 is the HOST triple here, so Gradle enables the test tasks instead of disabling them
      # the way it does on a Mac. scripts/linux-tests.sh exists for the macOS developer loop and
      # runs the same binaries in a container; this needs no container.
      #
      # :kiteplayer-ffmpeg is absent because its suites read the clips, which are generated on the
      # macOS job only. Linking it is still covered below.
      - name: linuxX64 tests, media-free modules
        run: |
          ./gradlew --stacktrace \
            :kiteplayer-core:linuxX64Test \
            :kiteplayer-subtitles:linuxX64Test \
            :kiteplayer-io:linuxX64Test \
            :kiteplayer-output:linuxX64Test \
            :kiteplayer-rt:linuxX64Test \
            :kiteplayer-libass:linuxX64Test \
            :kiteplayer:linuxX64Test

      # The player's FFmpeg backend links its embedded KiteFFmpeg on Linux. This is the step that
      # would catch kiteffmpeg-core shipping a klib whose linuxX64 half does not resolve.
      - name: Link the FFmpeg backend for linuxX64
        run: ./gradlew --stacktrace :kiteplayer-ffmpeg:linkDebugTestLinuxX64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-reports
          # test-results carries the XML, and the XML carries stdout, stderr and the message of a
          # NATIVE crash. reports/ alone renders an empty "Failure details" box when the test
          # process dies instead of asserting, which is exactly the failure worth diagnosing.
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Linux arm64, Kotlin/Native, in two jobs. Kotlin/Native ships no compiler for an arm64 Linux
  # host, so Gradle's linuxArm64Test task cannot run on one. The first job links the test binaries
  # on x64 Linux; the second executes them on an arm64 runner. scripts/linux-tests.sh does the same
  # from a Mac, with a container in place of the arm64 runner.
  # ---------------------------------------------------------------------------------------------
  linux-arm64-link:
    name: Linux arm64 (link the Kotlin/Native test binaries on x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-linux-arm64-cross-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-linux-arm64-cross-
            konan-linux-x64-
      - name: Warm the Kotlin/Native toolchain
        run: ./gradlew :kiteplayer-rt:downloadKotlinNativeDistribution --stacktrace

      # Every module that declares linuxArm64. :kiteplayer-ffmpeg is linked and not run, because
      # its suites read the clips, which are generated on the macOS job only.
      - name: Link the linuxArm64 test binaries
        run: |
          ./gradlew --stacktrace \
            :kiteplayer-core:linkDebugTestLinuxArm64 \
            :kiteplayer-subtitles:linkDebugTestLinuxArm64 \
            :kiteplayer-io:linkDebugTestLinuxArm64 \
            :kiteplayer-output:linkDebugTestLinuxArm64 \
            :kiteplayer-rt:linkDebugTestLinuxArm64 \
            :kiteplayer-libass:linkDebugTestLinuxArm64 \
            :kiteplayer:linkDebugTestLinuxArm64 \
            :kiteplayer-ffmpeg:linkDebugTestLinuxArm64

      - name: Hand the test binaries to the arm64 job
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-test-binaries
          path: |
            kiteplayer-core/build/bin/linuxArm64/debugTest/test.kexe
            kiteplayer-subtitles/build/bin/linuxArm64/debugTest/test.kexe
            kiteplayer-io/build/bin/linuxArm64/debugTest/test.kexe
            kiteplayer-output/build/bin/linuxArm64/debugTest/test.kexe
            kiteplayer-rt/build/bin/linuxArm64/debugTest/test.kexe
            kiteplayer-libass/build/bin/linuxArm64/debugTest/test.kexe
            kiteplayer/build/bin/linuxArm64/debugTest/test.kexe
          retention-days: 1
          if-no-files-found: error

  linux-arm64-native:
    name: Linux arm64 (Kotlin/Native, executed on an arm64 runner)
    needs: linux-arm64-link
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      # The checkout gives each binary the module directory that Gradle's test task runs it in.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64-test-binaries

      # The environment is the one Gradle's native test task sets, plus TMPDIR, which the suites
      # need and will not guess. The artifact store drops the executable bit, so it is set here.
      - name: linuxArm64 tests, media-free modules
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/test-logs"
          status=0
          for module in kiteplayer-core kiteplayer-subtitles kiteplayer-io kiteplayer-output \
                        kiteplayer-rt kiteplayer-libass kiteplayer; do
            binary="$GITHUB_WORKSPACE/$module/build/bin/linuxArm64/debugTest/test.kexe"
            if [ ! -f "$binary" ]; then
              echo "::error::$module: no test binary at $binary"
              status=1
              continue
            fi
            chmod +x "$binary"
            echo "::group::$module"
            (cd "$module" && TMPDIR="$RUNNER_TEMP" KITEPLAYER_TESTMEDIA="$GITHUB_WORKSPACE/testmedia" \
              "$binary") 2>&1 | tee "$RUNNER_TEMP/test-logs/$module.log"
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::error::$module: the test binary exited with code $code"
              status=1
            fi
          done
          exit $status

      # A green run must say how many tests ran, not only that none failed. A binary that printed
      # no summary, such as one that crashed, shows "no results".
      - name: The test counts
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import os, re
          print("### linuxArm64 test binaries, executed on an arm64 runner\n")
          print("| Test binary | Tests | Failed | Skipped |\n|---|---:|---:|---:|")
          for module in ("kiteplayer-core", "kiteplayer-subtitles", "kiteplayer-io", "kiteplayer-output",
                         "kiteplayer-rt", "kiteplayer-libass", "kiteplayer"):
              path = os.path.join(os.environ["RUNNER_TEMP"], "test-logs", f"{module}.log")
              text = open(path, errors="replace").read() if os.path.exists(path) else ""
              ran = re.search(r"^\[=+\] (\d+) tests? from .* ran", text, re.M)
              passed = re.search(r"^\[  PASSED  \] (\d+) tests?", text, re.M)
              failed = re.search(r"^\[  FAILED  \] (\d+) tests?, listed below", text, re.M)
              if not ran:
                  print(f"| {module} | no results | | |")
                  continue
              tests, ok, bad = int(ran[1]), int(passed[1]) if passed else 0, int(failed[1]) if failed else 0
              print(f"| {module} | {tests} | {bad} | {tests - ok - bad} |")
          EOF

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-native-logs
          path: ${{ runner.temp }}/test-logs/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Windows. A mingw link is not a run, and before this job the Windows matrix had never run on
  # Windows. This job runs it.
  # ---------------------------------------------------------------------------------------------
  windows-native:
    name: Windows x64 (Kotlin/Native, the first real Windows run)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-mingw-x64-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-mingw-x64-
      - name: Warm the Kotlin/Native toolchain
        run: ./gradlew :kiteplayer-rt:downloadKotlinNativeDistribution --stacktrace

      # mingwX64 is the host triple on this runner, so these EXECUTE. Media-free modules only, for
      # the same fixture reason as Linux.
      - name: mingwX64 tests, media-free modules
        run: >
          ./gradlew --stacktrace
          :kiteplayer-core:mingwX64Test
          :kiteplayer-subtitles:mingwX64Test
          :kiteplayer-output:mingwX64Test
          :kiteplayer-rt:mingwX64Test
          :kiteplayer-libass:mingwX64Test
          :kiteplayer:mingwX64Test

      - name: Link the FFmpeg backend for mingwX64
        run: ./gradlew --stacktrace :kiteplayer-ffmpeg:linkDebugTestMingwX64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-reports
          # test-results carries the XML, and the XML carries stdout, stderr and the message of a
          # NATIVE crash. reports/ alone renders an empty "Failure details" box when the test
          # process dies instead of asserting, which is exactly the failure worth diagnosing.
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # The web target. Node and a headless browser are two different environments and both are run,
  # which is how the one test that only held in node was found.
  # ---------------------------------------------------------------------------------------------
  web:
    name: wasmJs (node and headless browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # :kiteplayer-libass's web tests import the real kiteass.mjs, which this job links with
      # emscripten from the wasm32 chain (downloaded from the KiteFFmpeg release like the others).
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: latest
      # Kotlin/JS and Kotlin/Wasm fetch their own node and yarn into ~/.gradle, then populate
      # node_modules from the committed lockfile. Uncached that is a download plus an install on
      # every single run of this job, which was the largest fixed cost here.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/nodejs
            ~/.gradle/yarn
            build/js/node_modules
          key: kotlin-js-${{ hashFiles('kotlin-js-store/yarn.lock', 'gradle/libs.versions.toml') }}
          restore-keys: |
            kotlin-js-

      # wasmJsTest is BOTH halves: wasmJsNodeTest and wasmJsBrowserTest. Running only the node half
      # is what let WebCanvasVideoRendererTest assert a node-only refusal for as long as it did; the
      # browser really has OffscreenCanvas, so the same call draws there.
      #
      # `:kiteplayer-ffmpeg` contributes 46 tests here, not its whole suite. The tests that open real
      # clips live in its `realBackendTest` source set, which only the JVM and native targets take,
      # because a browser has no filesystem to read the clips from. What runs here is the shared
      # decoder logic, which is most of it: 29 of the 46 are `DecoderFallbackTest`.
      #
      # `:kiteplayer` runs its shared session tests here, and drives the web media session against a
      # fake session object, so nothing in it needs a browser's real media session.
      - name: wasmJs tests, node and browser
        run: |
          ./gradlew --stacktrace \
            :kiteplayer-core:wasmJsTest \
            :kiteplayer-subtitles:wasmJsTest \
            :kiteplayer-output:wasmJsTest \
            :kiteplayer-ffmpeg:wasmJsTest \
            :kiteplayer:wasmJsTest \
            :kiteplayer-libass:wasmJsTest

      # This was NODE ONLY until 2026-08-30, because the browser half used to abort inside webpack
      # with "RangeError: Invalid array length" while it timestamped a context directory. It no
      # longer does. Four attempts on the proving Mac that day all passed 25 browser tests: a plain
      # run, a run after deleting the module and wasm build directories, a run of all five wasm
      # modules together, and a --rerun-tasks with the wasm node_modules deleted. Nothing was
      # changed to fix it, so what actually cured it is not known. It is wired in rather than left
      # skipped precisely because of that: if it comes back, this job is what says so.
      - name: wasmJs tests, network (node and browser)
        run: ./gradlew --stacktrace :kiteplayer-network:wasmJsTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-reports
          # test-results carries the XML, and the XML carries stdout, stderr and the message of a
          # NATIVE crash. reports/ alone renders an empty "Failure details" box when the test
          # process dies instead of asserting, which is exactly the failure worth diagnosing.
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore
