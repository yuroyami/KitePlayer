name: Docs

# Builds the aggregated Dokka API reference (every published module, one site at
# build/dokka/html). Pushes validate the reference; only an explicit workflow dispatch deploys
# it to GitHub Pages: https://yuroyami.github.io/KitePlayer/.
# There is no prose site here; the README is the prose. KiteFFmpeg's docs.yml is the model,
# minus its MkDocs half and minus the FFmpeg tree fetch, since this repository's FFmpeg comes
# from the published kiteffmpeg artifacts.
#
# Until Pages is enabled in the repository settings (Settings > Pages > Source: GitHub Actions)
# the deploy job fails and the build job is still the proof that the reference generates.

on:
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/module.yaml'
      - '*.module-template.yaml'
      - 'project.yaml'
      - 'libs.versions.toml'
      - 'build-plugins/**'
      - 'dokka-templates/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and an in-progress one is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # macOS, not Ubuntu: Dokka reads the sources of every target, and the cinterop bindings of the
    # Apple targets need an Apple SDK found through xcrun.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      KOTLIN_CLI_NO_WELCOME_BANNER: "1"
    steps:
      - uses: actions/checkout@v4
      # The toolchain cache holds the JDK, the Maven downloads and the Kotlin/Native distribution.
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-docs-macos-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-docs-macos-
            kotlin-macos-host-

      # `dokka` writes the pages of each published module, and `dokkaSite` merges them.
      - name: Generate the Dokka API reference
        run: |
          # `do` is a command of the kotlin script here, not the shell keyword.
          # shellcheck disable=SC1010
          ./kotlin do dokka
          # shellcheck disable=SC1010
          ./kotlin do dokkaSite

      - name: Disable Jekyll processing
        run: touch build/dokka/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

  deploy:
    # Preparing an unpublished version on main must not replace the public API reference.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
