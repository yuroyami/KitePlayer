# KitePlayer's Compose presentation only: KitePlayerVideo and both video paths, with no player
# factory and no network.
product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

apply:
  - //kiteplayer.module-template.yaml
  - //android.module-template.yaml
  - //library.module-template.yaml
  - //compose.module-template.yaml

dependencies:
  - //kiteplayer-core: exported
  - $compose.runtime: exported
  - $compose.ui: exported
  - $compose.foundation
  - //kiteplayer-compose-interop
  - //kiteplayer-compose-video
  - //kiteplayer-view

dependencies@wasmJs:
  - //kiteplayer-output

test-dependencies@jvm:
  - $compose.desktop.currentOs
  - $compose.uiTest

settings:
  android:
    namespace: io.github.yuroyami.kiteplayer.compose.ui
  publishing:
    pom:
      name: kiteplayer-compose-ui
      description: >-
        KitePlayer's Compose presentation only: KitePlayerVideo and both video paths, with no player
        factory and no network.

plugins:
  publication-check:
    enabled: true
  abi-check:
    enabled: true
    androidDumpDir: api/android
    klibPlatforms: [ iosArm64, iosSimulatorArm64, wasmJs ]
  dokka:
    enabled: true
    moduleName: kiteplayer-compose-ui

# Gradle named the klib "io.github.yuroyami:kiteplayer-compose-ui". Keep that name, or libraries built against earlier
# releases fail to link on Kotlin/Native. Set it per platform: on @native, it also renames the
# klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-compose-ui, -Xshort-module-name=kiteplayer-compose-ui ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-compose-ui, -Xshort-module-name=kiteplayer-compose-ui ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteplayer-compose-ui ]

# Tests compile into their own klib, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteplayer-compose-ui_test, -Xshort-module-name=kiteplayer-compose-ui_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteplayer-compose-ui_test, -Xshort-module-name=kiteplayer-compose-ui_test ]

test-settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kiteplayer-compose-ui_test ]
