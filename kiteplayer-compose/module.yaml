# KitePlayer for Compose Multiplatform: the default playback stack of kiteplayer plus both Compose
# video paths and the switch between them.
product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

apply:
  - //kiteplayer.module-template.yaml
  - //android.module-template.yaml
  - //library.module-template.yaml
  - //compose.module-template.yaml

dependencies:
  - //kiteplayer: exported
  - //kiteplayer-compose-ui: exported
  - $compose.runtime

test-dependencies@jvm:
  - $compose.desktop.currentOs

settings:
  android:
    namespace: io.github.yuroyami.kiteplayer.compose
  publishing:
    pom:
      name: kiteplayer-compose
      description: >-
        KitePlayer for Compose Multiplatform: the default playback stack of kiteplayer plus both Compose
        video paths and the switch between them.

plugins:
  publication-check:
    enabled: true
  abi-check:
    enabled: true
    androidDumpDir: api/android
    klibPlatforms: [ iosArm64, iosSimulatorArm64, wasmJs ]
  dokka:
    enabled: true
    moduleName: kiteplayer-compose

# Gradle named the klib "io.github.yuroyami:kiteplayer-compose". Keep that name, or libraries built against earlier
# releases fail to link on Kotlin/Native. Set it per platform: on @native, it also renames the
# klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-compose, -Xshort-module-name=kiteplayer-compose ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-compose, -Xshort-module-name=kiteplayer-compose ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteplayer-compose ]

# Tests compile into their own klib, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteplayer-compose_test, -Xshort-module-name=kiteplayer-compose_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteplayer-compose_test, -Xshort-module-name=kiteplayer-compose_test ]

test-settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kiteplayer-compose_test ]
