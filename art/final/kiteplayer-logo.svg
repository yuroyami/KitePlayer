    <path d="M264 576 L235 620 L259 624 L267 587 Z" fill="#7438D8"/>
    <path d="M906 744 L900 784 L925 788 L914 752 Z" fill="#F14B55"/>

    <!-- One continuous wind-loaded sail, retaining the reference silhouette. -->
    <path d="M366 190
      C542 197 777 259 947 367
      C958 446 935 573 900 729
      C794 643 631 592 471 563
      C379 546 311 549 270 579
      L306 230
      C310 202 334 188 366 190 Z"
      fill="url(#kiteplayer-sail-base)" stroke="#25143D" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M366 190
      C542 197 777 259 947 367
      C958 446 935 573 900 729
      C794 643 631 592 471 563
      C379 546 311 549 270 579
      L306 230
      C310 202 334 188 366 190 Z"
      fill="url(#kiteplayer-fabric-depth)"/>

    <!-- Separate filled fabric bays preserve the reference's abrupt color rhythm. -->
    <path d="M394 193 C435 195 475 201 517 208 C533 336 507 451 470 552 C421 543 381 537 348 537 C386 430 404 315 394 193 Z" fill="url(#kiteplayer-bay-violet)"/>
    <path d="M517 208 C569 218 622 231 674 246 C687 370 658 486 615 574 C566 563 517 556 470 552 C507 451 533 336 517 208 Z" fill="url(#kiteplayer-bay-magenta)"/>
    <path d="M674 246 C727 261 778 280 824 300 C838 419 801 533 753 620 C711 602 664 586 615 574 C658 486 687 370 674 246 Z" fill="url(#kiteplayer-bay-rose)"/>
    <path d="M824 300 C869 319 910 341 947 367 C947 474 917 592 868 673 C832 653 793 635 753 620 C801 533 838 419 824 300 Z" fill="url(#kiteplayer-bay-coral)"/>
    <path d="M394 193 C435 195 475 201 517 208 C533 336 507 451 470 552 C421 543 381 537 348 537 C386 430 404 315 394 193 Z M517 208 C569 218 622 231 674 246 C687 370 658 486 615 574 C566 563 517 556 470 552 C507 451 533 336 517 208 Z M674 246 C727 261 778 280 824 300 C838 419 801 533 753 620 C711 602 664 586 615 574 C658 486 687 370 674 246 Z M824 300 C869 319 910 341 947 367 C947 474 917 592 868 673 C832 653 793 635 753 620 C801 533 838 419 824 300 Z" fill="url(#kiteplayer-fabric-depth)"/>

    <!-- Fabric bays follow the source image's unequal perspective rhythm. -->
    <path d="M394 193 C404 315 386 430 348 537" fill="none" stroke="#3C195E" stroke-width="2.3" stroke-opacity="0.72"/>
    <path d="M517 208 C533 336 507 451 470 552" fill="none" stroke="#6E276F" stroke-width="2.3" stroke-opacity="0.62"/>
    <path d="M674 246 C687 370 658 486 615 574" fill="none" stroke="#77264F" stroke-width="2.3" stroke-opacity="0.55"/>
    <path d="M824 300 C838 419 801 533 753 620" fill="none" stroke="#7B293E" stroke-width="2.3" stroke-opacity="0.58"/>
    <path d="M947 367 C947 474 917 592 868 673" fill="none" stroke="#301521" stroke-width="2.5" stroke-opacity="0.82"/>

