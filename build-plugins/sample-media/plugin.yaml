tasks:
  assets:
    action: !io.github.yuroyami.kiteplayer.build.media.copySampleMedia
      repoRoot: ${project.rootDir}
      assetsDir: ${module.rootDir}/assets
      marker: ${taskOutputDir}/marker

generated:
