tasks:
  dumpKlib:
    action: !io.github.yuroyami.buildplugins.klibabi.dumpKlibAbi
      moduleName: ${module.name}
      platforms: ${pluginSettings.klibPlatforms}
      buildDir: ${project.rootDir}/build
      dumpFile: ${taskOutputDir}/klib.api

  checkKlib:
    action: !io.github.yuroyami.buildplugins.klibabi.checkKlibAbi
      moduleName: ${module.name}
      builtDump: ${tasks.dumpKlib.action.dumpFile}
      committedDump: ${module.rootDir}/${pluginSettings.klibDumpDir}/${module.name}.klib.api

  updateKlib:
    action: !io.github.yuroyami.buildplugins.klibabi.updateKlibAbi
      builtDump: ${tasks.dumpKlib.action.dumpFile}
      committedDump: ${tasks.checkKlib.action.committedDump}

# Not the names of abi-check: two plugins in one project cannot share a check or command name.
checks:
  # Run `./kotlin build` for every platform in klibPlatforms first.
  - name: klibOnlyAbi
    performedBy: checkKlib

commands:
  - name: updateKlibOnlyAbi
    performedBy: updateKlib
