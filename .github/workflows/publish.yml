# Publishes every KitePlayer library module to Maven Central (Central Portal) with the Kotlin
# Toolchain: `./kotlin publish mavenCentral`.
#
# ON DEMAND ONLY. workflow_dispatch is the single trigger; pushing a tag publishes nothing by
# itself. Publishing from the maintainer's machine is equally valid with the same credentials in the
# KOTLIN_TOOLCHAIN_* environment variables listed below:
#   ./kotlin publish mavenCentral
#
# By default the deployment waits on the Central Portal after validation (publishingMode manual in
# library.module-template.yaml). The final Publish click is human, deliberately: Central is
# immutable and a version cannot be withdrawn. The release input switches the upload job to auto.
#
# THE ONE STEP THAT IS NOT ATOMIC is the release itself: the upload stages a deployment, and a
# person releases it. Nothing in a deployment is public until the Publish click releases all of it
# together, so drop a failed or wrong deployment on the portal instead of releasing it.
#
# TESTS FIRST. The whole of CI runs on the commit being published, and the upload waits for it. A
# red test stops the run before anything reaches the portal.
#
# BILL OF MATERIALS. Before the upload, the run writes an SPDX document of the native code that
# kiteplayer-libass bundles (scripts/native-sbom.sh), and keeps it as the native-sbom-<version>
# artifact of the run. Attach that file to the GitHub release page.
#
# WEB ZIPS. A Kotlin Toolchain publication carries no extra files, so the two web zips of KitePlayer
# (the worker binary and the libass web module) are not on Maven Central. The run builds them with
# scripts/web-zips.sh and keeps them as the web-zips-<version> artifact. Attach them to the GitHub
# release page, where the README's web setup points.
#
# BUILD ATTESTATION. The attest job signs a build provenance attestation (#684) of every file the
# run hands out: each jar, klib, AAR, POM and module metadata file uploaded to Maven Central, the
# web zips and the bill of materials. It names this workflow file, the commit and the run. An app
# author checks a file with
#   gh attestation verify <file> --repo yuroyami/KitePlayer --signer-workflow yuroyami/KitePlayer/.github/workflows/publish.yml
# and adds --source-ref refs/tags/v<version> or --source-digest <commit> to pin what was built.
# Signatures are not subjects, because each one is made again for Central. The publish job lists
# the files as checksums from its Maven Local publication, the attest job signs that list, and only
# then does the upload job run (#777). It builds on a fresh runner, fails before the upload when any
# listed byte differs, uploads, and compares once more after, so the attested list is the bytes that
# went up and nothing is released before its attestation exists.
# Only the attest job holds the id-token and attestations permissions, and it reads only the list.
# A publish from the maintainer's machine carries no attestation; the release notes say which
# version's files carry one.
#
# PREREQUISITES
#   Repository secrets:
#     MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD   Central Portal user token
#     SIGNING_IN_MEMORY_KEY / SIGNING_IN_MEMORY_KEY_PASSWORD   ASCII-armored GPG key and its passphrase
#   SIGNING_IN_MEMORY_KEY_ID is no longer read: the toolchain takes the key id from the key.
#
# WHAT IS PUBLISHED. Every module whose publishing settings enable Maven Central. FFmpeg is NOT
# built here: KitePlayer resolves io.github.yuroyami:kiteffmpeg from Central and that artifact
# carries FFmpeg inside it. emscripten is installed only for the libass web module.
#
# WHY macOS. Apple klibs can only be produced on a macOS host, and the publication covers them.
name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match settings.publishing.version in library.module-template.yaml), e.g. 0.3.0"
        required: true
      release:
        description: "Also release the deployment on the Central Portal. Off leaves it validated for a human to publish."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.version }}
  cancel-in-progress: false

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  check-version:
    name: input matches the publishing version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # A stale version must never publish under the version someone asked for. The version is an
      # input so that the two are compared, and a mismatch is a failure instead of a surprise.
      - name: Assert version match
        run: |
          template_version="$(sed -n 's/^    version:[[:space:]]*//p' library.module-template.yaml | tr -d '[:space:]')"
          expected="${{ github.event.inputs.version }}"
          if [ "${template_version}" != "${expected}" ]; then
            echo "::error::version mismatch: library.module-template.yaml has version ${template_version} but the run asked for ${expected}" >&2
            exit 1
          fi
          for module in $(scripts/published-modules.sh); do
            module_version="$(sed -n 's/^    version:[[:space:]]*//p' "$module/module.yaml" | tr -d '[:space:]')"
            if [ -n "${module_version}" ] && [ "${module_version}" != "${expected}" ]; then
              echo "::error::$module/module.yaml sets version ${module_version}, not ${expected}" >&2
              exit 1
            fi
          done
          # A version with no changelog section has no release notes.
          if ! grep -q "^## \[${expected}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${expected}]' section; write the notes before publishing (scripts/release-notes.sh drafts them)" >&2
            exit 1
          fi
          echo "Publishing version ${template_version}"

  tests:
    name: CI on the commit being published
    needs: check-version
    uses: ./.github/workflows/ci.yml

  publish:
    name: build and list every publishing module
    needs: [check-version, tests]
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-publish-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-publish-
            kotlin-macos-host-

      # The version emscripten-version.txt pins, the one CI links with (#778).
      - name: Install emscripten
        run: ./scripts/install-emscripten.sh "$RUNNER_TEMP/emsdk"

      - name: Bill of materials for bundled native code
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./scripts/native-sbom.sh
      - name: Keep the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: native-sbom-${{ inputs.version }}
          path: build/sbom/
          if-no-files-found: error

      # Every host JNI library, every Android libass adapter and the libass web module must link
      # here, and the jars must carry them: a publish never ships a module with a missing half (#776).
      - name: Publication readiness
        env:
          KITEPLAYER_LIBASS_REQUIRE_ALL_HOST_JNI: "true"
          KITEPLAYER_LIBASS_REQUIRE_ANDROID_JNI: "true"
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          . scripts/test-signing-key.sh
          flags=()
          for module in $(scripts/published-modules.sh); do flags+=(-m "$module"); done
          ./kotlin publish mavenLocal --non-transitive "${flags[@]}"
          ./kotlin check publication
          ./scripts/check-libass-jars.sh

      - name: The web zips for the release page
        run: ./scripts/web-zips.sh
      - name: Keep the web zips
        uses: actions/upload-artifact@v4
        with:
          name: web-zips-${{ inputs.version }}
          path: build/web-zips/*.zip
          if-no-files-found: error

      # The subjects of the attestation, read from the publication above before the upload.
      - name: List the files to attest
        run: |
          mkdir -p build/attest
          ./scripts/attestation-subjects.sh maven > build/attest/maven.sha256
          ./scripts/attestation-subjects.sh release > build/attest/release.sha256
          wc -l build/attest/maven.sha256 build/attest/release.sha256

      # At most 1024 subjects go into one attestation, so the list is cut into parts of 1000.
      - name: Cut the list into attestation parts
        run: |
          cat build/attest/maven.sha256 build/attest/release.sha256 \
            | awk '{ part = int((NR - 1) / 1000); print > ("build/attest/subjects-" part ".sha256") }'
          parts="$(ls build/attest/subjects-*.sha256 | wc -l | tr -d ' ')"
          if [ "$parts" -gt 4 ]; then
            echo "::error::$parts parts of subjects; the attest job signs four, add a step there" >&2
            exit 1
          fi
      - name: Keep the list of files to attest
        uses: actions/upload-artifact@v4
        with:
          name: attestation-subjects-${{ inputs.version }}
          path: build/attest/subjects-*.sha256
          if-no-files-found: error
      - name: Keep the list of Maven files for the upload
        uses: actions/upload-artifact@v4
        with:
          name: maven-list-${{ inputs.version }}
          path: build/attest/maven.sha256
          if-no-files-found: error

  attest:
    name: signed build attestation of the published files
    needs: [check-version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: attestation-subjects-${{ inputs.version }}
          path: subjects
      - name: Attest the first thousand files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subjects/subjects-0.sha256
      - name: Attest the second thousand files
        if: hashFiles('subjects/subjects-1.sha256') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subjects/subjects-1.sha256
      - name: Attest the third thousand files
        if: hashFiles('subjects/subjects-2.sha256') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subjects/subjects-2.sha256
      - name: Attest the fourth thousand files
        if: hashFiles('subjects/subjects-3.sha256') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subjects/subjects-3.sha256

  # The upload waits for the attestation, so nothing reaches Central, and nothing is released,
  # before the files it names are attested (#777). It builds on a fresh runner and compares its
  # own Maven Local publication with the attested list before the upload, so a build that is not
  # reproducible stops here, and compares again after it, from an emptied Maven Local.
  upload:
    name: the attested files → Maven Central
    needs: [check-version, attest]
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-publish-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-publish-
            kotlin-macos-host-

      - name: Install emscripten
        run: ./scripts/install-emscripten.sh "$RUNNER_TEMP/emsdk"

      - uses: actions/download-artifact@v4
        with:
          name: maven-list-${{ inputs.version }}
          path: ${{ runner.temp }}/attested

      # Before anything builds, so that every publication of this job reads the same settings.
      # Only in this runner's checkout: the committed default stays manual.
      - name: Release the deployment on the portal
        if: inputs.release
        run: |
          sed -i '' 's/publishingMode: manual/publishingMode: auto/' \
            library.module-template.yaml kiteplayer-libass-android-natives/module.yaml

      - name: This build gives the attested files
        env:
          KITEPLAYER_LIBASS_REQUIRE_ALL_HOST_JNI: "true"
          KITEPLAYER_LIBASS_REQUIRE_ANDROID_JNI: "true"
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          . scripts/test-signing-key.sh
          flags=()
          for module in $(scripts/published-modules.sh); do flags+=(-m "$module"); done
          ./kotlin publish mavenLocal --non-transitive "${flags[@]}"
          ./scripts/attestation-subjects.sh maven > "$RUNNER_TEMP/maven-here.sha256"
          if ! diff -u "$RUNNER_TEMP/attested/maven.sha256" "$RUNNER_TEMP/maven-here.sha256"; then
            echo "::error::this runner built other bytes than the attested ones; nothing was uploaded" >&2
            exit 1
          fi

      - name: Publish to Maven Central
        env:
          KITEPLAYER_LIBASS_REQUIRE_ALL_HOST_JNI: "true"
          KITEPLAYER_LIBASS_REQUIRE_ANDROID_JNI: "true"
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./kotlin publish mavenCentral

      # The same comparison once more, after the upload, from an emptied Maven Local. With the
      # release input off, a failure here means: drop the deployment on the portal.
      - name: The uploaded files are the attested ones
        env:
          KITEPLAYER_LIBASS_REQUIRE_ALL_HOST_JNI: "true"
          KITEPLAYER_LIBASS_REQUIRE_ANDROID_JNI: "true"
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          . scripts/test-signing-key.sh
          mv "$HOME/.m2/repository/io/github/yuroyami" "$RUNNER_TEMP/before-upload"
          flags=()
          for module in $(scripts/published-modules.sh); do flags+=(-m "$module"); done
          ./kotlin publish mavenLocal --non-transitive "${flags[@]}"
          ./scripts/attestation-subjects.sh maven > "$RUNNER_TEMP/maven-again.sha256"
          if ! diff -u "$RUNNER_TEMP/attested/maven.sha256" "$RUNNER_TEMP/maven-again.sha256"; then
            echo "::error::the build gave other bytes after the upload than the attested ones" >&2
            exit 1
          fi
