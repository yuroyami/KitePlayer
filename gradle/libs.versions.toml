[versions] #######################################################################################
# Toolchain. Kept in lock-step with KiteImage / KiteAudio / KiteCodec / KitePDF so the Kite
# lineage builds with one shared stack. Values are pushed here by KiteVersions.
kotlin = "2.4.10"
agp = "9.2.1"
vanniktechPublish = "0.36.0"
dokka = "2.2.0"

coroutines = "1.11.0"
atomicfu = "0.31.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries] ######################################################################################
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

# The atomicfu *library* is used; its Gradle plugin is not. The plugin's JVM bytecode transform
# registers a task that depends on `androidMainClasses`, which AGP 9's Kotlin Multiplatform library
# plugin does not create, so applying it makes the Android variant fail to build. Without the
# transform each atomic field costs one wrapper object, allocated once when its owner is constructed
# and never per operation, which matters to nothing here.
[plugins] ########################################################################################
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
