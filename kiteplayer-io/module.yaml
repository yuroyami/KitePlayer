# The input doors that need a platform type: a JVM File or stream, an Android content URI or asset,
# a file path on Apple and Linux, or an Apple file URL. Each door returns a MediaIoFactory from the
# core, so the engine never sees a door.
product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX64
    - androidNativeX86
    - linuxX64
    - linuxArm64
    - mingwX64
    - js
    - wasmJs

aliases:
  - jvmAndAndroid: [ jvm, android ]
  # Apple and Linux share the POSIX file door.
  - posix: [ iosArm64, iosSimulatorArm64, iosX64, macosArm64, tvosArm64, tvosSimulatorArm64, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64, linuxX64, linuxArm64 ]

apply:
  - //kiteplayer.module-template.yaml
  - //android.module-template.yaml
  - //library.module-template.yaml

dependencies:
  - //kiteplayer-core: exported

test-dependencies:
  - $libs.kotlinx.coroutines.test

settings:
  android:
    namespace: io.github.yuroyami.kiteplayer.io
  publishing:
    pom:
      name: kiteplayer-io
      description: >-
        Input doors for KitePlayer: JVM files, paths, channels and streams, Android content URIs and assets,
        and file paths and URLs on Apple and Linux.

plugins:
  publication-check:
    enabled: true
  abi-check:
    enabled: true
    androidDumpDir: api/android
    klibPlatforms: [ androidNativeArm32, androidNativeArm64, androidNativeX64, androidNativeX86, iosArm64, iosSimulatorArm64, iosX64, js, linuxArm64, linuxX64, macosArm64, mingwX64, tvosArm64, tvosSimulatorArm64, wasmJs, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64 ]
  dokka:
    enabled: true
    moduleName: kiteplayer-io

# Gradle named the klib "io.github.yuroyami:kiteplayer-io". Keep that name, or libraries built against earlier
# releases fail to link on Kotlin/Native. Set it per platform: on @native, it also renames the
# klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-io, -Xshort-module-name=kiteplayer-io ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-io, -Xshort-module-name=kiteplayer-io ]

