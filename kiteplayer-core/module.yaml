# The engine. Pure Kotlin, coroutines and atomicfu only. It holds every playback decision: the
# player class, the session loop, the clock, sync, queues, buffering, the seek state machine and
# track selection. Its one platform-dependent declaration is the single-thread dispatchers its
# workers run on, so it builds for every platform below and is testable with a virtual clock.
product:
  type: kmp/lib
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX64
    - androidNativeX86
    - linuxX64
    - linuxArm64
    - mingwX64
    - js
    - wasmJs

aliases:
  # Every native platform but Android's, for the code that reads folders with opendir.
  - nativeButAndroid: [ iosArm64, iosSimulatorArm64, iosX64, macosArm64, tvosArm64, tvosSimulatorArm64, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64, linuxX64, linuxArm64, mingwX64 ]

apply:
  - //kiteplayer.module-template.yaml
  - //android.module-template.yaml
  - //library.module-template.yaml

dependencies:
  - $libs.kotlinx.coroutines.core: exported
  - $libs.kotlinx.atomicfu

# The C audio ring of kiteplayer-rt, for the native NativeAudioRing and the differential oracle
# in test@native. Exported: the kitert cinterop klib is the surface that the bindings expose.
dependencies@native:
  - //kiteplayer-rt: exported

test-dependencies:
  - $libs.kotlinx.coroutines.test

settings:
  kotlin:
    optIns: [ kotlin.RequiresOptIn ]
  android:
    namespace: io.github.yuroyami.kiteplayer.core
  publishing:
    pom:
      name: kiteplayer-core
      description: KitePlayer's playback engine and its service interfaces, in Kotlin, depending on coroutines only.

plugins:
  # The repository-wide checks run from this module only.
  repo-checks:
    enabled: true
  publication-check:
    enabled: true
  abi-check:
    enabled: true
    androidDumpDir: api/android
    klibPlatforms: [ androidNativeArm32, androidNativeArm64, androidNativeX64, androidNativeX86, iosArm64, iosSimulatorArm64, iosX64, js, linuxArm64, linuxX64, macosArm64, mingwX64, tvosArm64, tvosSimulatorArm64, wasmJs, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64 ]
  dokka:
    enabled: true
    moduleName: kiteplayer-core

# Gradle named the klib "io.github.yuroyami:kiteplayer-core". Keep that name, or libraries built against earlier
# releases fail to link on Kotlin/Native. Set it per platform: on @native, it also renames the
# klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-core, -Xshort-module-name=kiteplayer-core ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-core, -Xshort-module-name=kiteplayer-core ]

