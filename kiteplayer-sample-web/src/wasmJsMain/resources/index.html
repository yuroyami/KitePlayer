<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KV-6 probe</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #101014; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="module">
  // The codec is a SEPARATE wasm module with its own memory, so it is loaded here and published
  // on globalThis; the Kotlin side reaches it through JS. A module script is deferred, so this
  // resolves after the Kotlin bundle starts, which is why the Kotlin side waits rather than
  // assuming it is present.
  try {
    const factory = (await import("./kite.mjs")).default;
    globalThis.__kite = await factory();
  } catch (e) { console.warn("codec module unavailable:", e.message); globalThis.__kiteFailed = true; }
</script>
<script type="application/javascript" src="kiteplayer-sample-web.js"></script>
</body>
</html>
