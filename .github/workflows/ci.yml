# KitePlayer's continuous integration. Every job builds with the Kotlin Toolchain (`./kotlin`),
# which downloads its own JDKs, Kotlin/Native and dependencies. The Android SDK comes from the
# runner image (ANDROID_HOME).
#
#   - Each job caches the toolchain folder and `~/.konan`. `~/.konan` holds the LLVM and the
#     per-target sysroots that the C build plugins (kitert-c, libass-native) compile with. On a
#     fresh runner those plugins download Kotlin/Native themselves when the toolchain has not
#     unpacked it yet, so no warm-up step is needed.
#   - Every `./kotlin test` names its platforms with `-p`. Without it, a macOS runner would also try
#     to run the Linux and Windows test binaries.
#   - Every job says what it does NOT cover. A green tick that quietly skipped something is the
#     failure mode this project keeps paying for.
#
# WHAT THIS RUN DOES NOT COVER, stated once here rather than discovered later:
#
#   - `kiteplayer-output`'s CoreAudio suites on the iOS SIMULATOR. They open a real audio unit and
#     the simulator answers -10851 (kAudioUnitErr_InvalidPropertyValue), so the whole
#     CoreAudioSink family fails there for the environment rather than for the code. They DO run in
#     the macos-host job, where the audio device is real.
#   - `kiteplayer-ffmpeg` on the iOS simulator: RealMediaSeekTest cannot see the host's testmedia
#     tree through the simctl spawn boundary, and VideoToolboxDecodeTest needs hardware the
#     simulator does not have.
#   - Android device tests on real hardware, and the physical-device rows. The android-emulator job
#     runs the device test sets on an x86_64 emulator, except the classes that need clips on the
#     device; that job names them.
#   - A PINNED fixture generator. The clips are made by whatever ffmpeg Homebrew ships that week.
#   - `kiteplayer-output`'s CoreAudio ANCHOR assertion, on macOS too. See the macos-host job: this
#     runner's audio device lags where real hardware leads, so the one assertion that depends on
#     that is filtered out by name and reported as not run.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # The publish workflow runs this whole file on the commit it is about to publish.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when the publish workflow calls this file, so a release
  # run and a push run on the same branch never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:

  # ---------------------------------------------------------------------------------------------
  # The C suites. No JDK, no toolchain, no network.
  # ---------------------------------------------------------------------------------------------
  c-suites:
    name: The C suites (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # build-host.sh drives /usr/bin/clang directly and the ring includes stdint, stdlib, string
      # and stdatomic and nothing else.
      #
      # WHY macOS AND ONLY macOS. The allocation interposer is a Mach-O __DATA,__interpose dylib,
      # which only dyld honours; the device suites link -framework AudioToolbox -framework
      # CoreAudio. Neither has a Linux or Windows form.
      - name: kiteplayer-rt, plain (the correctness and allocation variant)
        working-directory: kiteplayer-rt/native
        run: ./scripts/build-host.sh plain && ./scripts/run-c-tests.sh plain

      # NOT a fourth build. It reruns the PLAIN binaries with KPRT_REQUIRE_ALLOC_ACCOUNTING=1, so a
      # suite that cannot observe the interposer FAILS instead of quietly recording a zero.
      - name: kiteplayer-rt, interpose (prove the instrument is live)
        working-directory: kiteplayer-rt/native
        run: ./scripts/run-c-tests.sh interpose

      - name: kiteplayer-rt, asan + ubsan
        working-directory: kiteplayer-rt/native
        run: ./scripts/build-host.sh asan && ./scripts/run-c-tests.sh asan

      # The ring is two seqlocks and two lock-free counters, and a seqlock written with plain
      # fields instead of C11 atomics is a real race TSan reports.
      - name: kiteplayer-rt, tsan
        working-directory: kiteplayer-rt/native
        run: ./scripts/build-host.sh tsan && ./scripts/run-c-tests.sh tsan

      # The packing suite needs neither jni.h nor libass; the driver suite needs a real libass and
      # asserts pixels, which is why the formula is installed here.
      - name: Install libass for the driver suite
        run: brew install libass
      - name: kiteplayer-libass, plain then asan
        working-directory: kiteplayer-libass/native
        run: ./scripts/run-c-tests.sh plain && ./scripts/run-c-tests.sh asan

  # ---------------------------------------------------------------------------------------------
  # The macOS host: the only runner that gets the real media, plus every ratchet.
  # ---------------------------------------------------------------------------------------------
  macos-host:
    name: macOS arm64 (real media, JVM + native, the ratchets)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-macos-host-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-macos-host-

      # kiteplayer-libass embeds the libass chain that KiteFFmpeg cross-builds, downloaded from the
      # KiteFFmpeg release pinned in kiteplayer-libass/ass-chain.sha256. ffmpeg is the fixture
      # generator below.
      #
      # THE GENERATOR IS PINNED TO A SERIES, the one the clips are recorded against
      # (EXPECTED_FFMPEG_SERIES in testmedia.sh) and the one the player's own library is on. Some
      # fixtures are oracles that FFmpeg itself produces, and an oracle from another major is a
      # different answer. The strict check below refuses when the formula moves to the next major.
      # brew update first: the runner image ships a formula index from the day it was built.
      - name: Install the ffmpeg CLI the clips are recorded against
        run: |
          brew update --quiet
          brew install ffmpeg
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"

      - name: Check the ffmpeg the clips are pinned to
        run: ./scripts/testmedia.sh --check-only
        env:
          TESTMEDIA_STRICT_FFMPEG: "1"

      # Generated per run rather than cached: the cache would cost more to move than the clips
      # cost to make.
      - name: Generate the test clips
        run: ./scripts/testmedia.sh

      # Printed rather than verified, deliberately: a printed manifest turns "why did that matrix
      # row behave differently on the runner" into a diff between two logs.
      - name: The clips, and what made them
        run: cat testmedia/MANIFEST.txt

      # The ratchets first, because a surface change should fail before a long test suite does.
      # The klib and Android dumps read the compiled libraries, so every published module is built
      # for every platform first. kitertCoupling holds the kitert boundary against a committed
      # baseline.
      - name: The ratchets
        run: |
          modules=$(scripts/published-modules.sh | sed 's/^/-m /' | tr '\n' ' ')
          # shellcheck disable=SC2086 # one word per flag
          ./kotlin build $modules
          # Only a publish compiles the shared folders such as src@native. Compile them here, so an
          # error in one fails this job and not the release.
          metadata=$(./kotlin show tasks | grep -oE ':kiteplayer[a-z-]*:compileMetadata[A-Za-z0-9]+' |
            grep -v ':kiteplayer-sample' | sort -u)
          # shellcheck disable=SC2086 # one word per task
          ./kotlin task $metadata
          ./kotlin check abi klibAbi klibOnlyAbi androidAbi kitertCoupling duplicateClasses
          ./scripts/check-dependency-hygiene.sh

      # Every module that HAS jvm tests. The ones that need the clips (ffmpeg, kiteplayer,
      # compose-video, audioviz) are here rather than on Linux for the generator reason above.
      # This job generated the clips above, so a test that finds one missing fails rather than
      # skipping. One module per run, because the wall-clock gates must not compete with other
      # modules' tests or compilation. audioviz runs through its gate script, which leaves out the
      # long rendering surveys.
      - name: JVM tests, every module that has them
        env:
          KITEPLAYER_REQUIRE_TESTMEDIA: "1"
        run: |
          . scripts/test-env.sh
          for module in kiteplayer-core kiteplayer-subtitles kiteplayer-io kiteplayer-output \
              kiteplayer-view kiteplayer-adaptive kiteplayer-network kiteplayer-ffmpeg kiteplayer-libass \
              kiteplayer kiteplayer-compose-video kiteplayer-compose-ui kiteplayer-compose-interop \
              kiteplayer-compose kiteplayer-sample-shared; do
            ./kotlin test -m "$module" -p jvm
          done
          ./scripts/audioviz-tests.sh gate

      # One line per hot path gate (HotPathGate.kt in the core and FFmpeg JVM tests). A slow drift
      # shows here long before it reaches a bound of ten times the measured median.
      - name: The hot path numbers
        if: always()
        run: |
          {
            echo "### Hot paths on $RUNNER_OS, median of seven runs"
            echo
            echo "| Hot path | Median | Bound |"
            echo "|---|---:|---:|"
            find build/reports -path '*/jvm/*.xml' -exec cat {} + 2>/dev/null |
              grep -o 'HOTPATH | .*' | grep -v 'HotPathGateTest' | sed 's/^HOTPATH //' || true
          } >> "$GITHUB_STEP_SUMMARY"

      # The Kotlin/Native host target. kiteplayer-ffmpeg here is the format conformance matrix
      # against real clips, and kiteplayer plays one clip through KitePlayerPlatform.createOrNull().
      #
      # kiteplayer-output runs through scripts/run-native-tests.sh, which drops ONE assertion and
      # nothing else: "the anchor the device publishes is in the near future on the engine clock".
      # It measured -451.7 ms against a window of -5 to +500 on this runner. That is the DEVICE, not
      # the clock bases: a virtual output device lags where real hardware leads. The test reports
      # as not run rather than passed, and a developer on a real Mac runs all of them.
      - name: Kotlin/Native macosArm64 tests
        run: |
          . scripts/test-env.sh
          ./kotlin test -p macosArm64 -m kiteplayer-core -m kiteplayer-subtitles -m kiteplayer-io \
            -m kiteplayer-rt -m kiteplayer-libass -m kiteplayer-adaptive -m kiteplayer-network \
            -m kiteplayer-ffmpeg -m kiteplayer
          ./scripts/run-native-tests.sh -m kiteplayer-output -p macosArm64 --exclude-set no-audio-hardware

      # An isolated external Gradle consumer must retain optional registration after Native
      # release optimization. A hosted runner also verifies public HTTPS independently of host
      # firewalls. Staging writes Maven Local and build/verification-maven; it never uploads.
      - name: Published-format Native consumer and HTTPS
        run: |
          ./scripts/verify-network-distribution.sh --stage
          ./scripts/verify-network-distribution.sh --run --target macos --url https://example.com

      # Every published artifact against artifact-size-baseline.txt: the JVM jar, the Android
      # archive and the macOS and iOS klibs. After the tests, so a size failure never hides a test
      # failure.
      - name: Artifact sizes
        run: ./scripts/check-artifact-size.sh

      # The publication check reads the POMs that the size step left in Maven Local.
      - name: Publication readiness
        run: ./kotlin check publication

      # Dokka fails on an unresolved KDoc link, which would otherwise render as plain text.
      - name: API reference
        run: |
          # `do` is a command of the kotlin script here, not the shell keyword.
          # shellcheck disable=SC1010
          ./kotlin do dokka

      # Written by the matrix run itself, before its assertion, so a FAILING run uploads the table
      # naming the row that failed.
      - name: The conformance report
        if: always()
        run: |
          for report in kiteplayer-ffmpeg/build/reports/conformance/*.md; do
            [ -f "$report" ] || continue
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-macos-host
          path: kiteplayer-ffmpeg/build/reports/conformance/*.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-host-reports
          path: |
            build/reports/**
            build/logs/**
            testmedia/MANIFEST.txt
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # iOS, on the simulator, for the suites that do not need a device.
  # ---------------------------------------------------------------------------------------------
  ios-simulator:
    name: iOS simulator arm64 (device-free suites)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-ios-sim-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-ios-sim-

      # kiteplayer-output runs through scripts/run-native-tests.sh with the simulator-audio set:
      # the two CoreAudio classes that need a device in every test, and nine tests of
      # CoreAudioSinkTest. Its other five tests, the clock and refusal arms, run here.
      - name: iosSimulatorArm64 tests
        run: |
          . scripts/test-env.sh
          ./kotlin test -p iosSimulatorArm64 -m kiteplayer-core -m kiteplayer-subtitles -m kiteplayer-io \
            -m kiteplayer-rt -m kiteplayer-view -m kiteplayer-adaptive -m kiteplayer-network \
            -m kiteplayer-libass -m kiteplayer-audioviz -m kiteplayer
          ./scripts/run-native-tests.sh -m kiteplayer-output -p iosSimulatorArm64 --exclude-set simulator-audio

      - name: Compile the iOS device targets
        run: |
          ./kotlin build -p iosArm64 -m kiteplayer-core -m kiteplayer-output -m kiteplayer-ffmpeg \
            -m kiteplayer-libass -m kiteplayer-view -m kiteplayer-audioviz

      - name: Install the ffmpeg CLI the clips are recorded against
        run: |
          brew update --quiet
          brew install ffmpeg
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"
      - name: Generate the test clips
        run: ./scripts/testmedia.sh
      - name: The iOS sample app, built, installed and launched in its smoke mode
        run: ./scripts/ios-sample-smoke.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-reports
          path: build/logs/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # tvOS and watchOS, on their simulators. `./kotlin test` runs only iOS simulator tests through
  # simctl, so these run through scripts/run-native-tests.sh.
  # ---------------------------------------------------------------------------------------------
  tvos-watchos-simulator:
    name: tvOS and watchOS simulators arm64 (core, subtitles, io, rt)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-tvos-watchos-sim-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-tvos-watchos-sim-

      - name: The simulator runtimes on this image
        run: xcrun simctl list runtimes

      - name: tvosSimulatorArm64 and watchosSimulatorArm64 tests
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/test-logs"
          status=0
          for platform in tvosSimulatorArm64 watchosSimulatorArm64; do
            for module in kiteplayer-core kiteplayer-subtitles kiteplayer-io kiteplayer-rt; do
              echo "::group::$module $platform"
              ./scripts/run-native-tests.sh -m "$module" -p "$platform" 2>&1 |
                tee "$RUNNER_TEMP/test-logs/$module-$platform.log"
              code=${PIPESTATUS[0]}
              echo "::endgroup::"
              [ "$code" -eq 0 ] || { echo "::error::$module $platform: exit $code"; status=1; }
            done
          done
          exit $status

      - name: The test counts
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import itertools, os, re
          print("### tvOS and watchOS simulator tests\n")
          print("| Module | Platform | Tests | Failed |\n|---|---|---:|---:|")
          for platform, module in itertools.product(("tvosSimulatorArm64", "watchosSimulatorArm64"),
                  ("kiteplayer-core", "kiteplayer-subtitles", "kiteplayer-io", "kiteplayer-rt")):
              path = os.path.join(os.environ["RUNNER_TEMP"], "test-logs", f"{module}-{platform}.log")
              text = open(path, errors="replace").read() if os.path.exists(path) else ""
              ran = re.search(r"^\[=+\] (\d+) tests? from .* ran", text, re.M)
              failed = re.search(r"^\[  FAILED  \] (\d+) tests?, listed below", text, re.M)
              cells = f"{ran[1]} | {failed[1] if failed else 0}" if ran else "no results |"
              print(f"| {module} | {platform} | {cells} |")
          EOF

  # ---------------------------------------------------------------------------------------------
  # Linux x64: the JVM and the Android host tests, which need no clips.
  # ---------------------------------------------------------------------------------------------
  linux-jvm-android:
    name: Linux x64 (JVM + Android host tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-linux-jvm-android-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-linux-jvm-android-

      - name: JVM tests, media-free modules
        run: |
          . scripts/test-env.sh
          ./kotlin test -p jvm -m kiteplayer-core -m kiteplayer-subtitles -m kiteplayer-io \
            -m kiteplayer-output -m kiteplayer-view -m kiteplayer-adaptive -m kiteplayer-network

      - name: The hot path numbers
        if: always()
        run: |
          {
            echo "### Hot paths on $RUNNER_OS, median of seven runs"
            echo
            echo "| Hot path | Median | Bound |"
            echo "|---|---:|---:|"
            find build/reports -path '*/jvm/*.xml' -exec cat {} + 2>/dev/null |
              grep -o 'HOTPATH | .*' | grep -v 'HotPathGateTest' | sed 's/^HOTPATH //' || true
          } >> "$GITHUB_STEP_SUMMARY"

      # `-p android` runs the Android unit tests on the JVM, the Android host tests.
      - name: Android host tests, media-free tests
        run: |
          . scripts/test-env.sh
          ./kotlin test -p android -m kiteplayer-core -m kiteplayer-subtitles -m kiteplayer-io \
            -m kiteplayer-output -m kiteplayer-compose-video -m kiteplayer-view -m kiteplayer-adaptive \
            -m kiteplayer-network -m kiteplayer-audioviz -m kiteplayer-sample-shared -m kiteplayer-libass

      - name: No class compiled by two published modules
        run: |
          modules=$(scripts/published-modules.sh | sed 's/^/-m /' | tr '\n' ' ')
          # shellcheck disable=SC2086 # one word per flag
          ./kotlin build -p jvm -p android $modules
          ./kotlin check duplicateClasses

      # The sample bundles the clip as an asset, so a placeholder stands in on this media-free runner.
      - name: Package the sample app for every Android ABI
        run: |
          mkdir -p testmedia
          [ -s testmedia/sync1080p30.mp4 ] || printf 'placeholder' > testmedia/sync1080p30.mp4
          ./kotlin build -m kiteplayer-sample-android
          apk=$(find build/tasks -path '*kiteplayer-sample-android*' -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo "the build made no APK"; exit 1; }
          echo "$apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libkitecodec_jni.so libkiteplayer_libass_jni.so; do
              unzip -l "$apk" "lib/$abi/$lib" > /dev/null || { echo "$apk has no lib/$abi/$lib"; exit 1; }
            done
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-jvm-android-reports
          path: |
            build/reports/**
            build/logs/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # The artifacts for the device tests. A KitePlayer library publishes Apple klibs too, so only a
  # macOS runner can publish it, and the emulator job runs on Linux.
  # ---------------------------------------------------------------------------------------------
  device-test-artifacts:
    name: Stage the artifacts for the device tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-device-test-artifacts-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-device-test-artifacts-
            kotlin-macos-host-
      - name: Publish the device test modules and their dependencies to build/verification-maven
        run: |
          ./scripts/stage-verification-maven.sh --with-dependencies \
            kiteplayer-io kiteplayer-output kiteplayer-ffmpeg kiteplayer-libass kiteplayer-compose-video \
            kiteplayer-compose kiteplayer-compose-interop kiteplayer-audioviz
      - uses: actions/upload-artifact@v4
        with:
          name: verification-maven
          path: build/verification-maven/
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # Android on an x86_64 emulator: the device tests and the Android native test binaries.
  # ---------------------------------------------------------------------------------------------
  android-emulator:
    name: Android emulator x86_64 (device tests + Android native tests)
    needs: device-test-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      AVD_PACKAGE: system-images;android-35;google_apis;x86_64
      NEEDS_PUSHED_MEDIA: io.github.yuroyami.kiteplayer.NeedsPushedMedia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verification-maven
          path: build/verification-maven
      # The device tests are a Gradle build (verification/device-tests), so this job also sets up
      # a JDK for it. The toolchain builds the Android native test binaries.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.konan
          key: kotlin-android-emulator-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-android-emulator-
            kotlin-linux-native-

      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator and the system image
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpulse0
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          log="$RUNNER_TEMP/sdkmanager.log"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "$AVD_PACKAGE" \
            < /dev/null > "$log" 2>&1 || { cat "$log"; exit 1; }
          image="$ANDROID_HOME/$(echo "$AVD_PACKAGE" | tr ';' '/')"
          [ -x "$ANDROID_HOME/emulator/emulator" ] && [ -d "$image" ] || { cat "$log"; exit 1; }
          version="$RUNNER_TEMP/emulator-version.txt"
          "$ANDROID_HOME/emulator/emulator" -version > "$version" 2>&1 || { cat "$version"; exit 1; }
          if grep -q "error while loading shared libraries" "$version"; then cat "$version"; exit 1; fi
          head -n 1 "$version"
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Create the virtual device
        run: |
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name kite --package "$AVD_PACKAGE" --device pixel_6 --force
          [ -f "$ANDROID_AVD_HOME/kite.ini" ] || { echo "::error::avdmanager wrote no kite.ini"; exit 1; }

      - name: Start the emulator
        run: |
          nohup emulator -avd kite -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &

      # While the emulator boots: the Android native test binaries, and the device test APKs.
      - name: Build the Android native test binaries and the device test APKs
        run: |
          for module in kiteplayer-core kiteplayer-subtitles kiteplayer-io kiteplayer-rt; do
            ./kotlin task ":$module:linkAndroidNativeX64TestDebug"
          done
          ./scripts/run-device-tests.sh --no-stage assembleAndroidTest

      - name: Wait for the emulator to finish booting
        id: boot
        run: |
          booted() { [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; }
          deadline=$((SECONDS + 600))
          if timeout 600 adb wait-for-device; then
            until booted || [ "$SECONDS" -ge "$deadline" ]; do sleep 5; done
          fi
          if ! booted; then
            echo "::error::The emulator did not finish booting within ten minutes."
            tail -n 100 "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell svc power stayon true
          adb shell input keyevent 82
          echo "API $(adb shell getprop ro.build.version.sdk | tr -d '\r')," \
            "ABIs $(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"

      # The classes marked @NeedsPushedMedia read clips that the next steps push; they are left out here.
      - name: Device tests, every module that has them
        run: |
          ./scripts/run-device-tests.sh --no-stage --continue \
            "-Pandroid.testInstrumentationRunnerArguments.notAnnotation=$NEEDS_PUSHED_MEDIA" \
            :io:connectedAndroidTest :output:connectedAndroidTest :ffmpeg:connectedAndroidTest \
            :libass:connectedAndroidTest :compose-video:connectedAndroidTest

      - name: Install the ffmpeg CLI the clips are recorded against
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet ffmpeg
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"

      - name: Generate the test clips
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: ./scripts/testmedia.sh
        env:
          TESTMEDIA_STRICT_FFMPEG: "1"

      # The clips go into each test APK's own external storage, as root, with the APK's uid.
      # ReopenDeviceTest runs once more after a failure (#301), and both runs count.
      - name: Device tests that read clips
        id: clips
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: |
          ./scripts/run-device-tests.sh --no-stage :ffmpeg:installAndroidDeviceTest :compose-video:installAndroidDeviceTest
          mkdir -p "$RUNNER_TEMP/test-logs"
          for _ in 1 2 3 4 5; do
            adb root > /dev/null 2>&1 || true
            adb wait-for-device
            [ "$(adb shell id -u | tr -d '\r')" = 0 ] && break
            sleep 2
          done
          [ "$(adb shell id -u | tr -d '\r')" = 0 ] || { echo "::error::adb did not become root"; exit 1; }
          status=0
          push_clips() {
            local pkg=$1 source=$2 uid app dir
            uid=$(adb shell pm list packages -U "$pkg" | tr -d '\r' | sed -n "s/^package:$pkg uid:\([0-9]*\)$/\1/p")
            if [ -z "$uid" ]; then
              echo "::error::$pkg is not installed"
              status=1
              return 1
            fi
            app="/data/media/0/Android/data/$pkg"
            dir="$app/files/testmedia"
            adb shell mkdir -p "$dir"
            adb push "$source" "$dir/" > /dev/null
            adb shell chown -R "$uid:ext_data_rw" "$app"
            adb shell restorecon -R "$app"
            adb shell ls -lZ "$dir" | head -n 3
          }
          run_tests() {
            local pkg=$1 out part
            shift
            out="$RUNNER_TEMP/test-logs/$pkg.txt"
            part="$RUNNER_TEMP/test-logs/part.txt"
            adb shell am instrument -w "$@" "$pkg/androidx.test.runner.AndroidJUnitRunner" | tr -d '\r' | tee "$part"
            cat "$part" >> "$out"
            grep -q '^OK (' "$part" || { echo "::error::$pkg: a test that reads clips failed"; status=1; }
          }
          ffmpeg_pkg=io.github.yuroyami.kiteplayer.ffmpeg.test
          compose_pkg=io.github.yuroyami.kiteplayer.compose.video.test
          push_clips "$ffmpeg_pkg" testmedia/. && run_tests "$ffmpeg_pkg" -e annotation "$NEEDS_PUSHED_MEDIA"
          if push_clips "$compose_pkg" testmedia/sync1080p30.mp4; then
            (
              for _ in $(seq 1 300); do
                adb logcat -d -s KiteReopen 2>/dev/null | grep -q "has run for" && break
                sleep 1
              done
              pid=$(adb shell pidof "$compose_pkg" | tr -d '\r')
              [ -n "$pid" ] && adb shell debuggerd -b "$pid" > "$RUNNER_TEMP/test-logs/reopen-native-stacks.txt" 2>&1
            ) &
            watcher=$!
            before=$status
            run_tests "$compose_pkg" -e class io.github.yuroyami.kiteplayer.compose.ReopenDeviceTest
            kill "$watcher" 2> /dev/null || true
            if [ "$status" != "$before" ]; then
              echo "::warning::ReopenDeviceTest failed, so it runs once more (#301)"
              echo "rerun=true" >> "$GITHUB_OUTPUT"
              status=$before
              run_tests "$compose_pkg" -e class io.github.yuroyami.kiteplayer.compose.ReopenDeviceTest
            fi
            run_tests "$compose_pkg" -e class io.github.yuroyami.kiteplayer.compose.GaplessVideoQueueDeviceTest
          fi
          adb unroot > /dev/null || true
          exit $status

      - name: Android native tests (androidNativeX64), on the emulator
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/test-logs"
          status=0
          for module in kiteplayer-core kiteplayer-subtitles kiteplayer-io kiteplayer-rt; do
            binary=$(find "build/tasks/_${module}_linkAndroidNativeX64TestDebug" -maxdepth 1 -name '*.kexe' | head -1)
            if [ -z "$binary" ]; then
              echo "::error::$module: no androidNativeX64 test binary"
              status=1
              continue
            fi
            dir="/data/local/tmp/kiteplayer/$module"
            adb shell mkdir -p "$dir"
            adb push "$binary" "$dir/test.kexe" > /dev/null
            adb shell chmod 755 "$dir/test.kexe"
            echo "::group::$module"
            adb shell "cd $dir && TMPDIR=$dir ./test.kexe" 2>&1 | tee "$RUNNER_TEMP/test-logs/$module.log"
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::error::$module: the test binary exited with code $code"
              status=1
            fi
          done
          exit $status

      # The toolchain builds no instrumented test APK for an app, so verification/device-tests
      # builds the sample from the same sources, with the assets that the toolchain build wrote.
      - name: The sample app's instrumented tests
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: |
          mkdir -p testmedia
          [ -s testmedia/sync1080p30.mp4 ] || printf 'placeholder' > testmedia/sync1080p30.mp4
          ./kotlin build -m kiteplayer-sample-android
          ./scripts/run-device-tests.sh --no-stage :sample-android:connectedDebugAndroidTest

      - name: The test counts
        if: always()
        env:
          REOPEN_RERUN: ${{ steps.clips.outputs.rerun }}
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import glob, os, re, xml.etree.ElementTree as ET
          print("### Android emulator: device tests\n")
          print("| Test project | Tests | Failed | Skipped |\n|---|---:|---:|---:|")
          for project in ("io", "output", "ffmpeg", "libass", "compose-video", "sample-android"):
              files = glob.glob(f"verification/device-tests/{project}/build/outputs/androidTest-results/connected/**/*.xml",
                                recursive=True)
              roots = [ET.parse(f).getroot() for f in files]
              suites = [s for r in roots for s in ([r] if r.tag == "testsuite" else r.iter("testsuite"))]
              total = lambda *keys: sum(int(s.get(k, 0)) for s in suites for k in keys)
              cells = f"{total('tests')} | {total('failures', 'errors')} | {total('skipped')}"
              print(f"| :{project} | {cells if suites else 'no results | |'} |")
          print("\n### Android emulator: device tests that read clips\n")
          print("| Test APK | Tests | Failed |\n|---|---:|---:|")
          for pkg in ("io.github.yuroyami.kiteplayer.ffmpeg.test",
                      "io.github.yuroyami.kiteplayer.compose.video.test"):
              path = os.path.join(os.environ["RUNNER_TEMP"], "test-logs", f"{pkg}.txt")
              text = open(path, errors="replace").read() if os.path.exists(path) else ""
              oks = [int(n) for n in re.findall(r"^OK \((\d+) tests?\)", text, re.M)]
              bads = [(int(a), int(b)) for a, b in re.findall(r"^Tests run: (\d+),\s+Failures: (\d+)", text, re.M)]
              tests = sum(oks) + sum(a for a, _ in bads)
              cells = f"{tests} | {sum(b for _, b in bads)}" if oks or bads else "no results |"
              print(f"| {pkg} | {cells} |")
          if os.environ.get("REOPEN_RERUN") == "true":
              print("\nReopenDeviceTest failed once and ran again, and both runs count above (#301).")
          print("\nThe classes marked `@NeedsPushedMedia`:\n")
          for path in sorted(glob.glob("*/android-device-test/**/*.kt", recursive=True)):
              if "\n@NeedsPushedMedia\n" in open(path, errors="replace").read():
                  print(f"- `{os.path.basename(path)[:-3]}`")
          print("\n### Android emulator: androidNativeX64 test binaries\n")
          print("| Test binary | Tests | Failed | Skipped |\n|---|---:|---:|---:|")
          for module in ("kiteplayer-core", "kiteplayer-subtitles", "kiteplayer-io", "kiteplayer-rt"):
              path = os.path.join(os.environ["RUNNER_TEMP"], "test-logs", f"{module}.log")
              text = open(path, errors="replace").read() if os.path.exists(path) else ""
              ran = re.search(r"^\[=+\] (\d+) tests? from .* ran", text, re.M)
              passed = re.search(r"^\[  PASSED  \] (\d+) tests?", text, re.M)
              failed = re.search(r"^\[  FAILED  \] (\d+) tests?, listed below", text, re.M)
              if not ran:
                  print(f"| {module} | no results | | |")
                  continue
              tests, ok, bad = int(ran[1]), int(passed[1]) if passed else 0, int(failed[1]) if failed else 0
              print(f"| {module} | {tests} | {bad} | {tests - ok - bad} |")
          EOF

      - name: Collect the emulator log and the device log
        if: failure() || steps.clips.outputs.rerun == 'true'
        run: |
          mkdir -p build/emulator-logs
          cp "$RUNNER_TEMP/emulator.log" build/emulator-logs/ || true
          cp "$RUNNER_TEMP"/test-logs/* build/emulator-logs/ || true
          timeout 60 adb logcat -d > build/emulator-logs/logcat.txt 2>&1 || true

      - name: Upload test reports
        if: failure() || steps.clips.outputs.rerun == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-reports
          path: |
            verification/device-tests/*/build/reports/androidTests/**
            verification/device-tests/*/build/outputs/androidTest-results/**
            build/emulator-logs/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Linux x64 Kotlin/Native, executed on the host.
  # ---------------------------------------------------------------------------------------------
  linux-native:
    name: Linux x64 (Kotlin/Native, executed not just linked)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.konan
          key: kotlin-linux-native-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-linux-native-

      - name: linuxX64 tests, media-free modules
        run: |
          . scripts/test-env.sh
          ./kotlin test -p linuxX64 -m kiteplayer-core -m kiteplayer-subtitles -m kiteplayer-io \
            -m kiteplayer-output -m kiteplayer-rt -m kiteplayer-libass -m kiteplayer

      # kiteplayer-ffmpeg's suites read clips, so this runner links its test binary only.
      - name: Link the FFmpeg backend for linuxX64
        run: ./kotlin task :kiteplayer-ffmpeg:linkLinuxX64TestDebug

      - name: Link the androidNativeArm32 test binaries
        run: |
          for module in kiteplayer-core kiteplayer-subtitles kiteplayer-io kiteplayer-rt; do
            ./kotlin task ":$module:linkAndroidNativeArm32TestDebug"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-reports
          path: build/logs/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Linux arm64: linked on x64, executed on an arm64 runner.
  # ---------------------------------------------------------------------------------------------
  linux-arm64-link:
    name: Linux arm64 (link the Kotlin/Native test binaries on x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.konan
          key: kotlin-linux-arm64-cross-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-linux-arm64-cross-
            kotlin-linux-native-

      - name: Link the linuxArm64 test binaries
        run: |
          mkdir -p linux-arm64-tests
          for module in kiteplayer-core kiteplayer-subtitles kiteplayer-io kiteplayer-output \
                        kiteplayer-rt kiteplayer-libass kiteplayer kiteplayer-ffmpeg; do
            ./kotlin task ":$module:linkLinuxArm64TestDebug"
            binary=$(find "build/tasks/_${module}_linkLinuxArm64TestDebug" -maxdepth 1 -name '*.kexe' | head -1)
            [ -n "$binary" ] || { echo "::error::$module: no linuxArm64 test binary"; exit 1; }
            cp "$binary" "linux-arm64-tests/$module.kexe"
          done

      - name: Hand the test binaries to the arm64 job
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-test-binaries
          path: linux-arm64-tests/
          retention-days: 1
          if-no-files-found: error

  linux-arm64-native:
    name: Linux arm64 (Kotlin/Native, executed on an arm64 runner)
    needs: linux-arm64-link
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64-test-binaries
          path: linux-arm64-tests

      # kiteplayer-ffmpeg's binary is linked above but not run: its suites read clips.
      - name: linuxArm64 tests, media-free modules
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/test-logs"
          status=0
          for module in kiteplayer-core kiteplayer-subtitles kiteplayer-io kiteplayer-output \
                        kiteplayer-rt kiteplayer-libass kiteplayer; do
            binary="$GITHUB_WORKSPACE/linux-arm64-tests/$module.kexe"
            if [ ! -f "$binary" ]; then
              echo "::error::$module: no test binary at $binary"
              status=1
              continue
            fi
            chmod +x "$binary"
            echo "::group::$module"
            (cd "$module" && TMPDIR="$RUNNER_TEMP" KITEPLAYER_TESTMEDIA="$GITHUB_WORKSPACE/testmedia" \
              "$binary") 2>&1 | tee "$RUNNER_TEMP/test-logs/$module.log"
            code=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::error::$module: the test binary exited with code $code"
              status=1
            fi
          done
          exit $status

      - name: The test counts
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import os, re
          print("### linuxArm64 test binaries, executed on an arm64 runner\n")
          print("| Test binary | Tests | Failed | Skipped |\n|---|---:|---:|---:|")
          for module in ("kiteplayer-core", "kiteplayer-subtitles", "kiteplayer-io", "kiteplayer-output",
                         "kiteplayer-rt", "kiteplayer-libass", "kiteplayer"):
              path = os.path.join(os.environ["RUNNER_TEMP"], "test-logs", f"{module}.log")
              text = open(path, errors="replace").read() if os.path.exists(path) else ""
              ran = re.search(r"^\[=+\] (\d+) tests? from .* ran", text, re.M)
              passed = re.search(r"^\[  PASSED  \] (\d+) tests?", text, re.M)
              failed = re.search(r"^\[  FAILED  \] (\d+) tests?, listed below", text, re.M)
              if not ran:
                  print(f"| {module} | no results | | |")
                  continue
              tests, ok, bad = int(ran[1]), int(passed[1]) if passed else 0, int(failed[1]) if failed else 0
              print(f"| {module} | {tests} | {bad} | {tests - ok - bad} |")
          EOF

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-native-logs
          path: ${{ runner.temp }}/test-logs/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Windows x64 Kotlin/Native, executed on the host. The wrapper here is kotlin.bat.
  # ---------------------------------------------------------------------------------------------
  windows-native:
    name: Windows x64 (Kotlin/Native)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\JetBrains\Kotlin
            ~\.konan
          key: kotlin-mingw-x64-${{ hashFiles('kotlin.bat', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-mingw-x64-

      - name: mingwX64 tests, media-free modules
        run: >
          kotlin.bat test -p mingwX64
          -m kiteplayer-core -m kiteplayer-subtitles -m kiteplayer-output -m kiteplayer-rt
          -m kiteplayer-libass -m kiteplayer

      - name: Link the FFmpeg backend for mingwX64
        run: kotlin.bat task :kiteplayer-ffmpeg:linkMingwX64TestDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-reports
          path: build/logs/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # The web: wasmJs tests, and the size budgets of the web modules.
  # ---------------------------------------------------------------------------------------------
  web:
    name: wasmJs (node and headless browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # emcc links kiteass.mjs, the libass web module that kiteplayer-libass's web tests load.
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: latest
      - name: kiteplayer-libass C suites on wasm32
        run: ./kiteplayer-libass/native/scripts/run-c-tests.sh wasm32
      - uses: actions/cache@v4
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-web-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-web-

      - name: Install the ffmpeg CLI the clips are recorded against
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --quiet ffmpeg
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"

      - name: Generate the test clips
        run: ./scripts/testmedia.sh
        env:
          TESTMEDIA_STRICT_FFMPEG: "1"

      # The browser runner talks to Chrome over a WebSocket, which Node has from version 22.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Node and a headless browser are two different environments, and both run. `./kotlin test -p wasmJs`
      # gives a module 30 seconds in the browser, so scripts/web-tests runs the browser half instead. It also
      # serves the clips, the codec module and the worker's test server that some browser tests read.
      - name: wasmJs tests, node and browser
        run: python3 scripts/web-tests/run.py --platform wasmJs --platform wasmJsBrowser

      # The browser format matrix prints its conformance table into the test output. This copies the
      # table into the run summary, beside the macOS one.
      - name: The browser conformance report
        if: always()
        run: |
          log=build/web-tests/kiteplayer-ffmpeg-wasmJsBrowser.log
          if [ -f "$log" ] && grep -q '^# Format conformance' "$log"; then
            # From the heading to the last row of the table.
            awk '/^# Format conformance/ { on = 1 } on { if (/^\|/) table = 1; else if (table) exit; print }' "$log" |
              tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The browser format matrix left no conformance report"
          fi

      - name: The web modules' sizes
        run: ./scripts/check-web-size.sh

      - name: Keep the measured web files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-size
          path: build/web-zips/*.zip
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-reports
          path: |
            build/logs/**
            build/web-tests/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Kotlin/JS on Node. The toolchain links the JS test bundles; scripts/web-tests runs them.
  # ---------------------------------------------------------------------------------------------
  js:
    name: Kotlin/JS (node)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/cache@v4
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-js-${{ hashFiles('kotlin', 'project.yaml', '*.module-template.yaml', '**/module.yaml', 'libs.versions.toml', 'build-plugins/**/plugin.yaml') }}
          restore-keys: |
            kotlin-js-

      - name: JS tests, node
        run: python3 scripts/web-tests/run.py --platform js

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: js-reports
          path: |
            build/logs/**
            build/web-tests/**
          retention-days: 14
          if-no-files-found: ignore
