      C359 185 325 194 311 214
      C305 224 304 242 301 263
      L257 557
      C254 578 257 594 265 594
      C275 594 282 571 287 548
      L342 352
      C352 320 353 305 340 278
      C329 256 318 233 326 214
      C335 196 360 192 394 193 Z"
