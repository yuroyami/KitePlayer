#Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.apple.xcodeCompatibility.nowarn=true
kotlin.native.ignoreDisabledTargets=true

#Dokka (v2 generator, aggregated API site at build/dokka/html)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

#Android
android.useAndroidX=true

#Library coordinates
GROUP=io.github.yuroyami
VERSION=0.0.22
DESCRIPTION=KitePlayer: a Kotlin Multiplatform media player engine with a pure Kotlin common core. Android and iOS provide the playable stack; JVM, JS, and Wasm publish explicit unavailable facade and Compose-surface placeholders for clean commonMain consumption.
