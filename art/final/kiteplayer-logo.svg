<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="kiteplayer-title kiteplayer-desc">
  <title id="kiteplayer-title">KitePlayer logo</title>
  <desc id="kiteplayer-desc">A wind-filled bowed sled kite in Kotlin violet, magenta, and coral, with two bridle lines converging into a loose flying line.</desc>
  <defs>
    <radialGradient id="kiteplayer-bg" cx="50%" cy="43%" r="73%">
      <stop offset="0" stop-color="#0D0C11"/>
      <stop offset="0.62" stop-color="#0C0B10"/>
      <stop offset="1" stop-color="#0B0A0F"/>
    </radialGradient>
    <linearGradient id="kiteplayer-sail-base" x1="330" y1="215" x2="944" y2="668" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6534B5"/><stop offset="0.28" stop-color="#8149E0"/><stop offset="0.48" stop-color="#D53BB2"/><stop offset="0.7" stop-color="#DF4387"/><stop offset="1" stop-color="#F55C57"/></linearGradient>
    <linearGradient id="kiteplayer-bay-violet" x1="404" y1="202" x2="468" y2="548" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8A53E9"/><stop offset="0.45" stop-color="#8149E0"/><stop offset="1" stop-color="#7A42D4"/></linearGradient>
    <linearGradient id="kiteplayer-bay-magenta" x1="520" y1="214" x2="610" y2="568" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#D43DB4"/><stop offset="0.48" stop-color="#D53EB5"/><stop offset="1" stop-color="#C734A3"/></linearGradient>
    <linearGradient id="kiteplayer-bay-rose" x1="676" y1="254" x2="751" y2="615" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E24889"/><stop offset="0.48" stop-color="#E04286"/><stop offset="1" stop-color="#D43878"/></linearGradient>
    <linearGradient id="kiteplayer-bay-coral" x1="827" y1="308" x2="878" y2="671" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F76459"/><stop offset="0.5" stop-color="#F45C58"/><stop offset="1" stop-color="#E94E53"/></linearGradient>
    <linearGradient id="kiteplayer-fabric-depth" x1="0" y1="190" x2="0" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.44" stop-color="#FFFFFF" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#3A092D" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="kiteplayer-lip" x1="274" y1="545" x2="907" y2="715" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B62BCB"/>
      <stop offset="0.5" stop-color="#D62B91"/>
      <stop offset="0.82" stop-color="#DB315E"/>
      <stop offset="1" stop-color="#9C293D"/>
    </linearGradient>
    <linearGradient id="kiteplayer-left-roll" x1="360" y1="190" x2="257" y2="594" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#824DF2"/>
      <stop offset="0.48" stop-color="#6B38D1"/>
      <stop offset="1" stop-color="#5428B7"/>
    </linearGradient>
    <linearGradient id="kiteplayer-right-roll" x1="963" y1="374" x2="905" y2="752" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7169"/>
      <stop offset="0.48" stop-color="#F45B59"/>
      <stop offset="1" stop-color="#E64450"/>
    </linearGradient>
    <linearGradient id="kiteplayer-bridle" x1="405" y1="525" x2="750" y2="1067" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEE7FF"/>
      <stop offset="0.55" stop-color="#DCCEFF"/>
      <stop offset="1" stop-color="#CBB8FF"/>
    </linearGradient>
  </defs>

  <rect width="1254" height="1254" fill="url(#kiteplayer-bg)"/>

  <g id="kiteplayer-art">
