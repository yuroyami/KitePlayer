# The Compose video path that hosts the platform's native video view.
product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, js, wasmJs ]

apply:
  - //kiteplayer.module-template.yaml
  - //android.module-template.yaml
  - //library.module-template.yaml
  - //compose.module-template.yaml

dependencies:
  - //kiteplayer-core: exported
  - $compose.runtime: exported
  - $compose.ui: exported

dependencies@android:
  - //kiteplayer-view-bindings

dependencies@ios:
  - //kiteplayer-view-bindings

dependencies@jvm:
  - //kiteplayer-view-bindings

test-dependencies@jvm:
  - $compose.desktop.currentOs
  - $compose.uiTest

settings:
  android:
    namespace: io.github.yuroyami.kiteplayer.compose.interop
  publishing:
    pom:
      name: kiteplayer-compose-interop
      description: KitePlayer's Compose video path that hosts the platform's native video view.

plugins:
  publication-check:
    enabled: true
  abi-check:
    enabled: true
    androidDumpDir: api/android
    klibPlatforms: [ iosArm64, iosSimulatorArm64, js, wasmJs ]
  dokka:
    enabled: true
    moduleName: kiteplayer-compose-interop

# Gradle named the klib "io.github.yuroyami:kiteplayer-compose-interop". Keep that name, or libraries built against earlier
# releases fail to link on Kotlin/Native. Set it per platform: on @native, it also renames the
# klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-compose-interop, -Xshort-module-name=kiteplayer-compose-interop ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-compose-interop, -Xshort-module-name=kiteplayer-compose-interop ]

settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteplayer-compose-interop ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteplayer-compose-interop ]

# Tests compile into their own klib, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteplayer-compose-interop_test, -Xshort-module-name=kiteplayer-compose-interop_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteplayer-compose-interop_test, -Xshort-module-name=kiteplayer-compose-interop_test ]

test-settings@js:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kiteplayer-compose-interop_test ]

test-settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kiteplayer-compose-interop_test ]
