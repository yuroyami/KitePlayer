    <path d="M394 193 C401 310 391 424 348 536" fill="none" stroke="#281342" stroke-width="2.3"/>
    <path d="M385 195
      C351 191 328 200 324 220
      C320 242 335 264 344 284
      C354 307 350 326 342 354
      L286 543"
      fill="none" stroke="#17101F" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M311 214 C304 230 303 247 301 269 L258 556 C256 570 256 580 260 587"
      fill="none" stroke="#A86FFF" stroke-width="2" stroke-opacity="0.58" stroke-linecap="round"/>

    <!-- Rolled, inflated right end cell. -->
    <path d="M947 367
      C978 374 1016 409 1024 435
      C1030 454 1021 478 1015 495
      L930 728
      C924 745 913 757 905 752
      C898 748 902 731 906 714
      L957 529
      C964 503 974 489 993 476
      C1010 464 1017 449 1009 431
      C1001 407 974 382 947 367 Z"
      fill="url(#kiteplayer-right-roll)" stroke="#29121D" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M947 369
      C975 383 1005 409 1012 433
      C1019 454 1007 466 991 478
      C971 494 961 510 956 536
      L902 733
      C917 650 947 474 947 369 Z"
      fill="#B63F47" fill-opacity="0.72"/>
    <path d="M947 369
      C975 383 1005 409 1012 433
      C1019 454 1007 466 991 478
      C971 494 961 510 956 536
      L902 733"
      fill="none" stroke="#2C1420" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M1019 423 C1028 443 1024 462 1015 481 L930 728 C924 743 916 751 909 751"
      fill="none" stroke="#FF8A79" stroke-width="2" stroke-opacity="0.54" stroke-linecap="round"/>

    <!-- Double-ring tow points. -->
    <g>
      <circle cx="408" cy="523" r="13" fill="#E8E0FF" stroke="#21162C" stroke-width="3.5"/>
      <circle cx="408" cy="523" r="5.5" fill="#17151D"/>
      <circle cx="813" cy="637" r="19" fill="#E8E0FF" stroke="#21162C" stroke-width="4"/>
      <circle cx="813" cy="637" r="8" fill="#17151D"/>
    </g>

    <!-- Bridle: dark keyline below the pale lavender cord. -->
    <g fill="none" stroke="#21192C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.78">
      <path d="M409 529 C426 593 474 687 519 762"/>
      <path d="M535 793 C549 819 565 861 573 893"/>
      <path d="M812 641 C769 687 710 744 659 791"/>
      <path d="M638 818 C614 843 592 873 579 899"/>
      <path d="M577 925 C574 965 592 994 627 1010 C664 1028 718 1026 740 1048 C746 1054 749 1061 749 1067"/>
    </g>
    <g fill="none" stroke="url(#kiteplayer-bridle)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M409 529 C426 593 474 687 519 762"/>
      <path d="M535 793 C549 819 565 861 573 893"/>
      <path d="M812 641 C769 687 710 744 659 791"/>
      <path d="M638 818 C614 843 592 873 579 899"/>
      <path d="M577 925 C574 965 592 994 627 1010 C664 1028 718 1026 740 1048 C746 1054 749 1061 749 1067"/>
    </g>

    <!-- Small connector sleeves between the bridle sections. -->
    <g fill="#DDD1FF" stroke="#302641" stroke-width="2" stroke-linejoin="round">
      <path d="M517 760 L523 756 L540 790 L534 797 L527 792 Z"/>
      <path d="M657 789 L663 795 L641 820 L635 814 L641 807 Z"/>
    </g>
    <path d="M524 772 L534 791" stroke="#F3EEFF" stroke-width="1.5"/>
    <path d="M649 802 L640 812" stroke="#F3EEFF" stroke-width="1.5"/>

    <!-- Three-wrap center hitch. -->
    <g fill="none" stroke="#21192C" stroke-width="10" stroke-linecap="round" opacity="0.78">
      <path d="M560 894 C570 903 583 904 593 897"/>
      <path d="M558 905 C570 914 584 914 595 907"/>
      <path d="M559 916 C572 925 585 925 595 918"/>
    </g>
    <g fill="none" stroke="#DED1FF" stroke-width="6" stroke-linecap="round">
      <path d="M560 894 C570 903 583 904 593 897"/>
      <path d="M558 905 C570 914 584 914 595 907"/>
      <path d="M559 916 C572 925 585 925 595 918"/>
    </g>
  </g>
</svg>
