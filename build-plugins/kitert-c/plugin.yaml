# One task per Kotlin/Native target, so a build of one platform compiles only that platform's archive.
# Each def goes to its own platform fragment, the same as a file in cinterop@<platform>/.
tasks:
  compileMacosArm64:
    action: !io.github.yuroyami.kiteplayer.build.kitert.compileKiteRt
      konanTarget: macos_arm64
      kotlinVersion: ${module.settings.kotlin.version}
      sourceDir: ${module.rootDir}/native/src
      includeDir: ${module.rootDir}/native/include
      defTemplate: ${module.rootDir}/native/kitert.def
      archiveDir: ${taskOutputDir}/macos_arm64
      defFile: ${taskOutputDir}/kitert.def

  compileIosArm64:
    action: !io.github.yuroyami.kiteplayer.build.kitert.compileKiteRt
      konanTarget: ios_arm64
