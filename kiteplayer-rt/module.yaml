# KitePlayer's real-time audio core, in C, with the symbol prefix `kprt_`. It publishes a
# declaration-free main klib beside one callable surface: the `kitert` cinterop klib over
# native/include/kite_rt.h, plus the static archive that cinterop embeds per target. Its Kotlin
# wrapper lives in kiteplayer-core, because the wrapper implements an internal interface there.
#
# The kitert-c plugin compiles native/src for each target and writes the kitert definition from
# native/kitert.def, so no cinterop/ folder is needed here.
product:
  type: kmp/lib
  platforms:
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX64
    - androidNativeX86
    - linuxX64
    - linuxArm64
    - mingwX64

aliases:
  # kiteplayer-output calls the kitert functions in its code for these three platforms. The toolchain commonizes
  # kitert only for the platform sets of this module's own fragments, so this fragment makes that set exist here.
  - macosAndIos: [ macosArm64, iosArm64, iosSimulatorArm64 ]

apply:
  - //kiteplayer.module-template.yaml
  - //library.module-template.yaml

settings:
  kotlin:
    optIns: [ kotlin.RequiresOptIn, kotlinx.cinterop.ExperimentalForeignApi ]
  publishing:
    pom:
      name: kiteplayer-rt
      description: KitePlayer's real-time audio ring, in C. It comes with kiteplayer-core on native targets; never add it yourself.

plugins:
  publication-check:
    enabled: true
  kitert-c: enabled
  # The klib half of abi-check: this module has no JVM classes for abi-check's JVM dump.
  klib-abi-check:
    enabled: true
    klibPlatforms: [ androidNativeArm32, androidNativeArm64, androidNativeX64, androidNativeX86, iosArm64, iosSimulatorArm64, iosX64, linuxArm64, linuxX64, macosArm64, mingwX64, tvosArm64, tvosSimulatorArm64, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64 ]

# Gradle named the klib "io.github.yuroyami:kiteplayer-rt". Keep that name, or libraries built against earlier
# releases fail to link on Kotlin/Native. Set it per platform: on @native, it also renames the
# klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-rt, -Xshort-module-name=kiteplayer-rt ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-rt, -Xshort-module-name=kiteplayer-rt ]

