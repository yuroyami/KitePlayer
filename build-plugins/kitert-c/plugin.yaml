generated:
  cinteropDefinitions:
    - defFile: ${tasks.compileMacosArm64.action.defFile}
      fragment: "@macosArm64"
    - defFile: ${tasks.compileIosArm64.action.defFile}
      fragment: "@iosArm64"
    - defFile: ${tasks.compileIosSimulatorArm64.action.defFile}
      fragment: "@iosSimulatorArm64"
    - defFile: ${tasks.compileIosX64.action.defFile}
      fragment: "@iosX64"
    - defFile: ${tasks.compileTvosArm64.action.defFile}
      fragment: "@tvosArm64"
    - defFile: ${tasks.compileTvosSimulatorArm64.action.defFile}
      fragment: "@tvosSimulatorArm64"
    - defFile: ${tasks.compileWatchosArm32.action.defFile}
