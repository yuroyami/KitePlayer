[versions] #######################################################################################
# Toolchain. Kept in lock-step with KiteImage / KiteAudio / KiteFFmpeg / KitePDF so the Kite
# lineage builds with one shared stack. Values are pushed here by KiteVersions.
kotlin = "2.4.10"
agp = "9.2.1"
vanniktechPublish = "0.36.0"
dokka = "2.2.0"
kiteffmpeg = "0.1.0"
ktor = "3.5.2"

coroutines = "1.11.0"
atomicfu = "0.31.0"
# Compose Multiplatform, for :kiteplayer-compose-interop and :kiteplayer-compose-video. The
# compatibility :kiteplayer-compose artifact only re-exports those modules. The Compose compiler
# ships inside the Kotlin distribution since Kotlin 2.0, so its plugin below rides the Kotlin version.
composeMultiplatform = "1.12.0-rc01"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# Device tests of :kiteplayer-compose-video only: the ComponentActivity + setContent host.
androidxActivityCompose = "1.13.0"

[libraries]
# The codec backend. One entry so the library coordinate and the Gradle plugin below cannot drift
# to different versions: they are the same release and a mismatch resolves two FFmpeg bindings.
kiteffmpeg-core = { module = "io.github.yuroyami:kiteffmpeg-core", version.ref = "kiteffmpeg" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" } ######################################################################################
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# The Android Main dispatcher factory. Applications only (the sample); no library module needs Main.
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }

# The atomicfu *library* is used; its Gradle plugin is not. The plugin's JVM bytecode transform
# registers a task that depends on `androidMainClasses`, which AGP 9's Kotlin Multiplatform library
# plugin does not create, so applying it makes the Android variant fail to build. Without the
# transform each atomic field costs one wrapper object, allocated once when its owner is constructed
# and never per operation, which matters to nothing here.
[plugins] ########################################################################################
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
