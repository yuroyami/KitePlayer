# The Compose video path that Compose draws itself.
product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

aliases:
  # Platforms where the frame upload runs on a thread of its own.
  - threaded: [ android, iosArm64, iosSimulatorArm64, jvm ]
  # Platforms where Compose draws with Skiko.
  - skiko: [ iosArm64, iosSimulatorArm64, jvm ]

apply:
  - //kiteplayer.module-template.yaml
  - //android.module-template.yaml
  - //library.module-template.yaml
  - //compose.module-template.yaml

dependencies:
  - //kiteplayer-core: exported
  - $compose.runtime: exported
  - $compose.ui: exported
  - $compose.foundation
  - $libs.kotlinx.atomicfu

dependencies@android:
  - //kiteplayer-ffmpeg
  - //kiteplayer-output

dependencies@ios:
  - //kiteplayer-ffmpeg
  - //kiteplayer-output

dependencies@jvm:
  - //kiteplayer-ffmpeg

dependencies@wasmJs:
  - //kiteplayer-ffmpeg

test-dependencies@jvm:
  - $compose.desktop.currentOs

settings:
  kotlin:
    optIns: [ io.github.yuroyami.kiteplayer.KitePlayerInternalApi ]
    freeCompilerArgs: [ -Xexpect-actual-classes ]
  android:
    namespace: io.github.yuroyami.kiteplayer.compose.video
  publishing:
    pom:
      name: kiteplayer-compose-video
      description: KitePlayer's Compose video path that Compose draws itself.

plugins:
  publication-check:
    enabled: true
  abi-check:
    enabled: true
    androidDumpDir: api/android
    klibPlatforms: [ iosArm64, iosSimulatorArm64, wasmJs ]
  dokka:
    enabled: true
    moduleName: kiteplayer-compose-video


# The JVM tests run in the module folder. They read the clips of scripts/testmedia.sh from here.
test-settings@jvm:
  jvm:
    test:
      extraEnvironment:
        KITEPLAYER_TESTMEDIA: ../testmedia

# Gradle named the klib "io.github.yuroyami:kiteplayer-compose-video". Keep that name, or libraries built against earlier
# releases fail to link on Kotlin/Native. Set it per platform: on @native, it also renames the
# klibs of shared native code, which must keep their own names.
settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-compose-video, -Xshort-module-name=kiteplayer-compose-video ]

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=io.github.yuroyami:kiteplayer-compose-video, -Xshort-module-name=kiteplayer-compose-video ]

settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=io.github.yuroyami:kiteplayer-compose-video ]

# Tests compile into their own klib, which needs a different name. The test blocks name the
# same platforms as the blocks above, so the toolchain applies them last.
test-settings@iosArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteplayer-compose-video_test, -Xshort-module-name=kiteplayer-compose-video_test ]

test-settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs: [ -module-name=kiteplayer-compose-video_test, -Xshort-module-name=kiteplayer-compose-video_test ]

test-settings@wasmJs:
  kotlin:
    freeCompilerArgs: [ -Xir-module-name=kiteplayer-compose-video_test ]
