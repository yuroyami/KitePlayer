# Code that KitePlayer's local build plugins share: the Kotlin/Native C toolchain, the libass
# chain, the Android NDK lookup and downloads with retries. It is a plain library, so its tests
# run with `./kotlin test -m build-support`.
product: jvm/lib

settings:
  kotlin:
    version: 2.4.21
  jvm:
    jdk:
      version: 21
